name: Diagnostic temporaire Veille
on:
  push:
    branches: [feature/menu-musique-suno]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Contrôle secret et réponse des médias sans divulgation
        env:
          VEILLE_SECRET: ${{ secrets.VEILLE_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const secret=process.env.VEILLE_SECRET||'';
          const root='https://kissasoko.gg/.netlify/functions';
          console.log('SECRET_CLASS',secret.length===0?'ABSENT':secret.length<16?'SHORT':'LONG');
          const request=async(path,opts={})=>{
            const r=await fetch(root+'/'+path,{...opts,signal:AbortSignal.timeout(15000)});
            console.log('HTTP',path,r.status);
            return r;
          };
          const invalid=await request('insta-store',{method:'POST',headers:{'x-veille-secret':secret,'Content-Type':'application/json'},body:'{}'});
          console.log('SECRET_MATCHES_NETLIFY',invalid.status===400);
          await invalid.body?.cancel();
          const resp=await request('get-insta',{headers:{'x-veille-secret':secret}});
          if(!resp.ok){await resp.body?.cancel();process.exit(0);}
          const feed=await resp.json();
          const posts=(feed.accounts||[]).flatMap(a=>a.posts||[]);
          const selected=posts.filter(p=>typeof p.image==='string'&&p.image.startsWith('http')).slice(0,20);
          console.log('FEED_COUNTS',JSON.stringify({feedDate:feed.fetchedAt,posts:posts.length,imageUrls:posts.filter(p=>p.image).length,first20:selected.length}));
          const counts={};
          const sample=await Promise.all(selected.map(async p=>{
            try{
              const r=await fetch(p.image,{signal:AbortSignal.timeout(9000),headers:{'Accept':'image/*','User-Agent':'Mozilla/5.0'}});
              const cat=r.status+' '+(r.headers.get('content-type')||'none').split(';')[0];
              await r.body?.cancel();
              return cat;
            }catch(e){return 'NETWORK_ERROR'}
          }));
          for(const x of sample)counts[x]=(counts[x]||0)+1;
          console.log('IMAGE_HTTP_SAMPLES',JSON.stringify(counts));
          JS
