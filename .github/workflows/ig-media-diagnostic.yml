name: Diagnostic provisoire des images Veille
on:
  push:
    branches: [feature/menu-musique-suno]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tester des URLs Instagram sans divulguer le flux
        env:
          VEILLE_SECRET: ${{ secrets.VEILLE_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const secret=process.env.VEILLE_SECRET || '';
          if (!secret) { console.log('collector secret absent'); process.exit(2); }
          const urls = [
            'https://kissasoko.gg/.netlify/functions/get-insta',
            'https://deploy-preview-3--kissasoko.netlify.app/.netlify/functions/get-insta'
          ];
          for(const url of urls){
            try {
              const response=await fetch(url,{headers:{'x-veille-secret':secret},signal:AbortSignal.timeout(15000)});
              console.log('FEED',new URL(url).hostname,'http',response.status);
              if(!response.ok)continue;
              const data=await response.json();
              const all=(data.accounts||[]).flatMap(a=>a.posts||[]);
              const images=all.filter(p=>p.image && /^https?:\/\//.test(p.image));
              const noImage=all.length-images.length;
              console.log('STATS',JSON.stringify({fetchedAt:data.fetchedAt,accounts:data.accounts?.length,posts:all.length,withImage:images.length,withoutImage:noImage}));
              const result={};
              for(const p of images.slice(0,12)){
                try {
                  const r=await fetch(p.image,{signal:AbortSignal.timeout(9500),headers:{'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/*,*/*;q=0.8'}});
                  const type=r.headers.get('content-type')||'none';
                  const label=r.status+' '+type.split(';')[0];
                  result[label]=(result[label]||0)+1;
                  await r.body?.cancel();
                } catch(e) {result['fetch-error']=(result['fetch-error']||0)+1;}
              }
              console.log('SAMPLE_IMAGE_HTTP',JSON.stringify(result));
            } catch(e){console.log('DIAG_ERROR',String(e.message));}
          }
          for(const u of [
            'https://kissasoko.gg/.netlify/functions/handles',
            'https://kissasoko.netlify.app/.netlify/functions/get-insta'
          ]) {
            try {const r=await fetch(u,{headers:{'x-veille-secret':secret},signal:AbortSignal.timeout(12000)});
              console.log('COLLECTOR_HEALTH',new URL(u).hostname,new URL(u).pathname,r.status);
              await r.body?.cancel();
            }catch(e){console.log('COLLECTOR_ERROR',e.message);}
          }
          console.log('COLLECTOR_SECRET_MIN_LENGTH',secret.length>=16);
          try {
            const response=await fetch('https://kissasoko.gg/.netlify/functions/insta-store',{
              method:'POST',headers:{'x-veille-secret':secret,'Content-Type':'application/json'},
              body:'{}',signal:AbortSignal.timeout(12000)
            });
            // Payload volontairement invalide : 400 indique que le secret est accepté,
            // 401 qu'il est refusé ; aucun flux n'est modifié.
            console.log('INVALID_WRITE_AUTH_CHECK',response.status);
            await response.body?.cancel();
          } catch(e){console.log('INVALID_WRITE_ERROR',e.message);}
          const igUser=process.env.IG_USER_ID,igToken=process.env.IG_ACCESS_TOKEN;
          if(igUser && igToken) {
            const fields='business_discovery.username(nasjaafar){media.limit(1){media_url,thumbnail_url,media_type}}';
            try {
              const meta=await fetch('https://graph.facebook.com/v25.0/'+encodeURIComponent(igUser)+'?fields='+encodeURIComponent(fields)+'&access_token='+encodeURIComponent(igToken),{signal:AbortSignal.timeout(15000)});
              const payload=await meta.json();
              console.log('GRAPH_SAMPLE',meta.status,!!payload.business_discovery?.media?.data?.length);
              const item=payload.business_discovery?.media?.data?.[0];
              const url=item?.media_type==='VIDEO'?(item?.thumbnail_url||item?.media_url):item?.media_url;
              if(url){const r=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{'User-Agent':'Mozilla/5.0'}});
                console.log('GRAPH_FRESH_IMAGE_HTTP',r.status,r.headers.get('content-type'));
                await r.body?.cancel();}
            }catch(e){console.log('GRAPH_ERROR',e.message);}
          }
          JS
