name: Vérification du build Kissa Soko
on:
  push:
    branches: [feature/community-auth-watch]
  pull_request:
    branches: [legal-and-privacy]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coffee-dashboard/coffee-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier les catégories des images Matériel
        run: node --test tests/gearVisual.test.mjs
      - name: Compiler les pages et le forum
        run: npm run build

      - name: Vérifier correction du HTML public
        run: |
          node --input-type=module <<'JS'
          const url='https://kissasoko.gg/?check-newline=20261015';
          for(let attempt=1;attempt<=15;attempt++){
            try{
              const res=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
              const html=await res.text();
              const found=html.includes('/fonts.css" />\\n');
              const ok=res.status===200&&!found&&html.includes('/favicon.svg');
              console.log(JSON.stringify({attempt,status:res.status,foundLiteralNewline:found,ok,excerpt:html.slice(740,1070)}));
              if(ok){console.log('SITE_FIXED');process.exit(0);}
            }catch(e){console.log(JSON.stringify({attempt,error:e.message}))}
            await new Promise(done=>setTimeout(done,10000));
          }
          process.exit(1);
          JS
