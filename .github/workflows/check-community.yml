name: Vérification du build Kissa Soko
on:
  push:
    branches: [feature/community-auth-watch]
  pull_request:
    branches: [legal-and-privacy]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coffee-dashboard/coffee-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier les catégories des images Matériel
        run: node --test tests/gearVisual.test.mjs
      - name: Compiler les pages et le forum
        run: npm run build

      - name: Contrôle du site de production après fusion
        run: |
          node --input-type=module <<'JS'
          const base='https://kissasoko.gg';
          const probe=async (path) => {
            const response=await fetch(base+path, {redirect:'follow',signal:AbortSignal.timeout(18000),headers:{'Cache-Control':'no-cache'}});
            const data=await response.arrayBuffer();
            return {status:response.status, type:response.headers.get('content-type')||'',url:response.url,bytes:data.byteLength,text:new TextDecoder().decode(data)};
          };
          for(let attempt=1;attempt<=12;attempt++){
            let checks=[];
            try{
              const home=await probe('/?release-check-20261015='+attempt);
              const legal=await probe('/conditions-communaute.html?check='+attempt);
              const media=await probe('/materiel-moulin-manuel.png?check='+attempt);
              const privateFeed=await probe('/.netlify/functions/get-insta?check='+attempt);
              const forumApi=await probe('/.netlify/functions/get-gear?check='+attempt);
              const assets=[...home.text.matchAll(/(?:src|href)="(\/assets\/[^"]+\.js)"/g)].map(v=>v[1]);
              const js=await Promise.all(assets.map(x=>probe(x)));
              const bundle=js.map(x=>x.text).join('\n');
              checks=[
                ['home',home.status===200 && home.type.includes('text/html')],
                ['legal',legal.status===200 && legal.text.includes('Règles de la communauté')],
                ['image',media.status===200 && media.type.includes('image/png') && media.bytes>200000],
                ['private-veille',privateFeed.status===401],
                ['rss-material',forumApi.status===200 && forumApi.text.includes('"gear"')],
                ['new-bundle',bundle.includes('materiel-moulin-manuel.png') && bundle.includes('Modération') && bundle.includes('conditions-communaute.html')]
              ];
              console.log(JSON.stringify({attempt,checks,script_count:assets.length,home_bytes:home.bytes,privateStatus:privateFeed.status}));
              if(checks.every(x=>x[1])){console.log('PRODUCTION_SMOKE_PASS');break;}
            }catch(e){console.log(JSON.stringify({attempt,error:e.message}));}
            if(attempt===12){console.error('PRODUCTION_SMOKE_FAIL');process.exit(1);}
            await new Promise(resolve=>setTimeout(resolve,12000));
          }
          const www=await fetch('https://www.kissasoko.gg/',{redirect:'follow',signal:AbortSignal.timeout(18000)});
          console.log(JSON.stringify({check:'www',status:www.status,finalUrl:www.url}));
          if(www.status!==200||new URL(www.url).hostname!=='kissasoko.gg')process.exit(1);
          JS
