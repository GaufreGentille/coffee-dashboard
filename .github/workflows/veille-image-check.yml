name: Veille image status check
on:
  push:
    branches: [feature/menu-musique-suno]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check media responses without disclosing private content
        env:
          VEILLE_SECRET: ${{ secrets.VEILLE_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const base = 'https://kissasoko.gg';
          const secret=process.env.VEILLE_SECRET||'';
          const result=await fetch(base+'/.netlify/functions/get-insta', {headers:{'x-veille-secret':secret}});
          console.log('feed status', result.status, 'credential configured', secret.length>=16);
          if(!result.ok) process.exit(0);
          const feed=await result.json();
          const posts=(feed.accounts||[]).flatMap(account=>account.posts||[]);
          const urls=posts.map(post=>post.image).filter(Boolean);
          console.log('feed date',feed.fetchedAt,'posts',posts.length,'with media',urls.length);
          const counts={};
          for(const url of urls.slice(0,16)){
            try{
              const response=await fetch(url,{headers:{Accept:'image/*'},signal:AbortSignal.timeout(7500)});
              const tag=response.status+' '+(response.headers.get('content-type')||'unknown').split(';')[0];
              counts[tag]=(counts[tag]||0)+1;
              await response.body?.cancel();
            }catch(e){counts['network error']=(counts['network error']||0)+1;}
          }
          console.log('sample response counts',JSON.stringify(counts));
          JS
