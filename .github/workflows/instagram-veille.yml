name: Veille Instagram

on:
  schedule:
    - cron: '30 3 * * 0'   # chaque dimanche à 03:30 UTC (nuit du samedi au dimanche, ~2h30 de run)
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: read

jobs:
  fetch-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # sharp réduit chaque visuel en WebP 640 px avant stockage (≈30 Ko au lieu de ≈250).
      # Sans lui le script marche quand même, en stockant les images d'origine.
      - name: Install sharp
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34

      - name: Fetch Instagram feed (Business Discovery)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VEILLE_SECRET: ${{ secrets.VEILLE_SECRET }}
        run: node scripts/fetch-instagram.mjs
