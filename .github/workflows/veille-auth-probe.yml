name: Verification temporaire Veille (sans collecte)
on:
  push:
    branches: [feature/menu-musique-suno]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verifier secret et quelques images deja enregistrees
        env:
          VEILLE_SECRET: ${{ secrets.VEILLE_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const secret = process.env.VEILLE_SECRET || '';
          const base='https://kissasoko.gg/.netlify/functions/';
          console.log('SECRET_GE_16',secret.length >= 16);
          const options={headers:{'x-veille-secret':secret},signal:AbortSignal.timeout(15000)};
          const auth=await fetch(base+'insta-store',{method:'POST',headers:{'Content-Type':'application/json','x-veille-secret':secret},body:'{}',signal:AbortSignal.timeout(15000)});
          console.log('SECRET_VALIDATED_BY_NETLIFY',auth.status===400,'WRITE_ENDPOINT_HTTP',auth.status);
          await auth.body?.cancel();
          const preview='https://deploy-preview-3--kissasoko.netlify.app/.netlify/functions/';
          const previewAuth=await fetch(preview+'insta-store',{method:'POST',headers:{'Content-Type':'application/json','x-veille-secret':secret},body:'{}',signal:AbortSignal.timeout(15000)});
          console.log('PREVIEW_SECRET_VALIDATED',previewAuth.status===400,'PREVIEW_WRITE_ENDPOINT_HTTP',previewAuth.status);
          await previewAuth.body?.cancel();
          const previewRead=await fetch(preview+'get-insta',{headers:{'x-veille-secret':secret},signal:AbortSignal.timeout(15000)});
          console.log('PREVIEW_READ_FEED_HTTP',previewRead.status);
          await previewRead.body?.cancel();
          const response=await fetch(base+'get-insta',options);
          console.log('READ_FEED_HTTP',response.status);
          if(!response.ok){await response.body?.cancel();process.exit(0);}
          const data=await response.json();
          const posts=(data.accounts || []).flatMap(a=>a.posts||[]);
          const urls=posts.map(p=>p.image).filter(u=>typeof u==='string'&&u.startsWith('https://'));
          console.log('STORED_FEED',JSON.stringify({collectedAt:data.fetchedAt,accounts:data.accounts?.length,posts:posts.length,withImage:urls.length}));
          const selected=urls.slice(0,16);
          const results=await Promise.all(selected.map(async url=>{
            try {
              const r=await fetch(url,{headers:{'Accept':'image/*','User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(10000)});
              const result=[r.status,(r.headers.get('content-type')||'').split(';')[0]];
              await r.body?.cancel();
              return result.join(' ');
            }catch(e){return 'NETWORK_TIMEOUT_OR_ERROR';}
          }));
          const counts={};for(const x of results)counts[x]=(counts[x]||0)+1;
          console.log('SAMPLE_IMAGE_STATUSES',JSON.stringify(counts),'total',selected.length);
          JS
