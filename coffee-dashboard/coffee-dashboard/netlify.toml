[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # esbuild suit les imports relatifs vers netlify/lib et les embarque
  # dans chaque bundle de function.
  node_bundler = "esbuild"

[functions."*"]
  timeout = 30

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
