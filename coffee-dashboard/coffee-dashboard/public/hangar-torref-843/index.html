          SFX.crack(opts.sfx);
          if (rl("esprit")) { setMoney((m) => m + rl("esprit") * 3); }
        }
        if (cracked && !secondCrack && beanT >= SC_TEMP) { secondCrack = true; events.push({ t, label: "Second crack" }); SFX.crack(opts.sfx); }
        const curve = [...s.curve, { t, T: beanT }];
        if (beanT >= BURNT_TEMP) {
          if (rl("lg_midas")) { const g = Math.round(s.kg * 8); setMoney((m) => m + g); }
          return { ...s, t, beanT, envT, ror, scorch, crashed, cracked, fcTime, secondCrack, curve, events, done: "burnt" };
        }
        if (t >= 50) return { ...s, t, beanT, envT, ror, scorch, crashed, cracked, fcTime, secondCrack, curve, events, done: "timeout" };
        return { ...s, t, beanT, envT, ror, scorch, crashed, cracked, fcTime, secondCrack, curve, events };
      });
    }, 100);
    return () => clearInterval(iv);
  }, [session?.startedAt, session?.done, opts.fastSim]);

  const startRoast = (originId, kg) => {
    if ((green[originId] || 0) < kg) return;
    if (batchesToday >= dailyBatchCap) { say("Capacité du jour atteinte. Passe au jour suivant."); return; }
    setGreen((g) => ({ ...g, [originId]: r1(g[originId] - kg) }));
    setBatchesToday((n) => n + 1);
    gasRef.current = 60; setGasUI(60);
    setSession({
      originId, kg, vacuum: era >= 3 && vacuumMode, t: 0, beanT: 190, envT: 200, ror: 0, scorch: 0,
      crashed: false, cracked: false, fcTime: null, secondCrack: false,
      curve: [{ t: 0, T: 190 }], events: [], done: null, startedAt: Date.now(),
    });
    setTab("roast");
  };

  const finishRoast = (s, endT) => {
    if (!s.cracked) return { fail: "Débarqué avant le premier crack : le lot est sous-développé." };
    const li = LEVELS.findIndex((L) => endT >= L.lo && endT < L.hi);
    if (li === -1 && endT >= LEVELS[2].hi) return { fail: "Beaucoup trop poussé, le lot part au compost." };
    const level = li === -1 ? 0 : li;
    const L = LEVELS[level];
    let q = 100;
    const precCoef = (s.vacuum ? 0.7 : 1) * (1 - rl("sonde") * 0.12);
    q -= Math.abs(endT - L.target) * 4 * precCoef;
    const dtr = (s.t - s.fcTime) / s.t;
    if (dtr < 0.08 || dtr > 0.35) q -= 18;
    else if (dtr < 0.14 || dtr > 0.26) q -= 8;
    if (s.crashed) q -= 10;
    q -= Math.min(20, s.scorch);
    q += mLvl("qual") * 2;
    if (s.vacuum) q += 3;
    if (meta.endings?.unplugged) q += 4;
    const o = activeOrigins.find((x) => x.id === s.originId);
    if (o?.qBonus) q += o.qBonus;
    q = clamp(Math.round(q), 25, qCeil(meta.cpUnlocks));
    let outKg = s.kg * 0.85;
    let quantum = false;
    if (Math.random() < rl("quantique") * 0.1) { outKg += 0.5; quantum = true; }
    const lot = {
      id: lotId.current++, origin: s.originId, label: o.name, notes: o.notes,
      levelIdx: level, kg: r1(outKg), quality: q,
    };
    return { lot, dtr, quantum };
  };

  const dropBeans = () => {
    setSession((s) => {
      if (!s || s.done) return s;
      const res = finishRoast(s, s.beanT);
      if (res.fail) {
        if (rl("lg_midas")) { const g = Math.round(s.kg * 8); setMoney((m) => m + g); say(`Charbon gourmet : lot raté vendu +${g} €.`); }
        return { ...s, done: "fail", failMsg: res.fail };
      }
      setRoasted((r) => [...r, res.lot]);
      setBestLot((b) => (!b || res.lot.quality > b.quality
        ? { origin: res.lot.origin, label: res.lot.label, notes: res.lot.notes, levelIdx: res.lot.levelIdx, quality: res.lot.quality }
        : b));
      if (boss?.type === "rival") {
        setBoss((b) => (b && b.type === "rival" && res.lot.quality > (b.best || 0) ? { ...b, best: res.lot.quality } : b));
      }
      SFX.drop(opts.sfx);
      return { ...s, done: "ok", result: res.lot, dtr: res.dtr };
    });
  };

  const saveProfile = (lot) => {
    setProfiles((p) => {
      const cur = p[lot.levelIdx];
      if (cur && cur >= lot.quality) { say("Un meilleur profil existe déjà pour ce niveau."); return p; }
      say(`Profil ${LEVELS[lot.levelIdx].name} enregistré (qualité ${lot.quality}).`);
      return { ...p, [lot.levelIdx]: lot.quality };
    });
  };

  const autoRoast = (originId, levelIdx) => {
    const chargeKg = era === 3 ? 8 : era === 2 ? 4 : 2;
    if ((green[originId] || 0) < chargeKg) { say(`Il faut au moins ${chargeKg} kg de vert.`); return; }
    if (batchesToday >= dailyBatchCap) { say("Capacité du jour atteinte."); return; }
    const malus = Math.max(1, 4 - rl("express"));
    const q = hasDelegated("roast") ? qCeil(meta.cpUnlocks) : clamp(profiles[levelIdx] - malus, 25, qCeil(meta.cpUnlocks));
    const o = activeOrigins.find((x) => x.id === originId);
    setGreen((g) => ({ ...g, [originId]: r1(g[originId] - chargeKg) }));
    setBatchesToday((n) => n + 1);
    const qBonus = Math.random() < rl("quantique") * 0.1 ? 0.5 : 0;
    setRoasted((r) => [...r, {
      id: lotId.current++, origin: originId, label: o.name, notes: o.notes,
      levelIdx, kg: r1(chargeKg * 0.85 + qBonus), quality: q,
    }]);
    say(`Fournée auto : ${r1(chargeKg * 0.85 + qBonus)} kg de ${o.name}, ${LEVELS[levelIdx].name}, qualité ${q}.${qBonus ? " Le grain quantique a encore frappé." : ""}`);
  };

  const greenPrice = (o) => {
    let p = (rl("lg_monopole") ? o.base * 0.7 : (prices[o.id] ?? o.base)) * (1 - rl("mainverte") * 0.07);
    if (flashOffer?.type === "promo" && flashOffer.origin === o.id) p *= 0.5;
    if (boss?.type === "baron") p *= 3;
    return Math.max(2, Math.round(p));
  };

  const buyGreen = (o) => {
    const price = hasDelegated("market") ? 0 : greenPrice(o);
    if (money < price) { SFX.error(opts.sfx); say("Pas assez de trésorerie."); return; }
    setMoney((m) => m - price);
    const bonus = (rl("lg_serre") ? 1 : 0) + (Math.random() < rl("sansfond") * 0.1 ? 1 : 0);
    setGreen((g) => ({ ...g, [o.id]: r1((g[o.id] || 0) + 1 + bonus) }));
    if (bonus) say("Sac sans fond : un kilo offert s'est glissé dans la commande.");
  };

  const buyGear = (key, price, label) => {
    if (money < price) { SFX.error(opts.sfx); say("Pas assez de trésorerie."); return; }
    setMoney((m) => m - price);
    setGear((g) => ({ ...g, [key]: true }));
    say(`${label} : c'est installé.`);
  };


  const takeLoan = (amount) => {
    if (loan) { SFX.error(opts.sfx); say("Un prêt est déjà en cours."); return; }
    const debt = Math.round(amount * 1.3);
    setLoan({ debt, dueIn: 5 });
    setMoney((m) => m + amount);
    SFX.coin(opts.sfx);
    say(`Prêt de ${amount} € accordé. À rembourser : ${debt} € sous 5 jours.`);
  };

  const repayLoan = () => {
    if (!loan) return;
    if (money < loan.debt) { SFX.error(opts.sfx); say("Pas assez pour solder le prêt."); return; }
    setMoney((m) => m - loan.debt);
    setLoan(null);
    SFX.success(opts.sfx);
    say("Prêt remboursé. La banquière te fait presque un sourire.");
  };

  const directPrice = (lot) => {
    const base = lot.origin === "blend" ? 15 + lot.quality * 0.12 : 11 + lot.quality * 0.1;
    return Math.round(base * (1 + rl("grossiste") * 0.08 + mLvl("etiquettes") * 0.05) * (flashOffer?.type === "rush" ? 2 : 1));
  };

  const lotMatches = (lot, order) => {
    if (order.level !== null && lot.levelIdx !== order.level && !rl("lg_super")) return false;
    if (lot.kg < order.kg - 0.001) return false;
    if (order.minQ && lot.quality < order.minQ) return false;
    if (order.want === "blend") return lot.origin === "blend";
    if (order.want === null) return true;
    return lot.origin === order.want;
  };

  const fulfill = (order) => {
    const candidates = roasted.filter((l) => lotMatches(l, order)).sort((a, b) => b.quality - a.quality);
    if (!candidates.length) return;
    const lot = candidates[0];
    const gain = Math.round(order.pay * qPayMult(lot.quality) * (1 + rl("pourboire") * 0.05));
    setRoasted((r) => r.map((l) => (l.id === lot.id ? { ...l, kg: r1(l.kg - order.kg) } : l)).filter((l) => l.kg > 0.05));
    setOrders((os) => os.filter((o) => o.id !== order.id));
    setMoney((m) => m + gain);
    setRep((v) => clamp(r1(v + (lot.quality >= 80 ? 0.2 : 0.1)), 0, 5));
    setServed((n) => n + 1);
    SFX.coin(opts.sfx);
    say(`${order.client.n} repart avec son café. +${gain} €`);
  };

  const sellDirect = (lot, all) => {
    const kg = all ? lot.kg : Math.min(1, lot.kg);
    const gain = Math.round(directPrice(lot) * kg);
    setRoasted((r) => r.map((l) => (l.id === lot.id ? { ...l, kg: r1(l.kg - kg) } : l)).filter((l) => l.kg > 0.05));
    setMoney((m) => m + gain);
    say(`Vente directe : ${r1(kg)} kg de ${lot.label}. +${gain} €`);
  };

  // ————— Assemblage —————
  const assemblyParts = () =>
    roasted.map((l) => ({ lot: l, kg: Math.min(blendQty[l.id] || 0, l.kg) })).filter((p) => p.kg > 0.05);

  const previewAssembly = (parts) => {
    if (parts.length < 2) return null;
    const tot = parts.reduce((s, p) => s + p.kg, 0);
    if (tot < 0.9) return null;
    const levelFloat = parts.reduce((s, p) => s + p.lot.levelIdx * p.kg, 0) / tot;
    const level = clamp(Math.round(levelFloat), 0, 2);
    const spread = Math.max(...parts.map((p) => p.lot.levelIdx)) - Math.min(...parts.map((p) => p.lot.levelIdx));
    const baseQ = parts.reduce((s, p) => s + p.lot.quality * p.kg, 0) / tot;
    const origins = [...new Set(parts.map((p) => p.lot.origin))];
    const isPure = origins.length === 1 && origins[0] !== "blend";
    const byLabel = {};
    parts.forEach((p) => { byLabel[p.lot.label] = (byLabel[p.lot.label] || 0) + p.kg; });
    const compo = Object.entries(byLabel).sort((a, b) => b[1] - a[1])
      .map(([label, kg]) => ({ label, pct: Math.round((kg / tot) * 100) }));
    const notes = [];
    let q = baseQ;
    if (isPure) {
      if (spread >= 2) { q -= 6; notes.push("torréfactions trop éloignées (−6)"); }
      else if (spread === 1) notes.push("niveaux voisins mélangés");
    } else {
      const harmony = compo.length >= 3 ? 6 : 4;
      q += harmony; notes.push(`harmonie d'assemblage (+${harmony})`);
      const maxShare = Math.max(...compo.map((c) => c.pct));
      if (maxShare <= 70) { q += 3; notes.push("composition équilibrée (+3)"); }
      if (spread >= 2) { q -= 6; notes.push("Claire et Foncée dans le même sac (−6)"); }
      if (rl("palais")) { q += rl("palais"); notes.push(`Palais absolu (+${rl("palais")})`); }
    }
    q = clamp(Math.round(q), 25, qCeil(meta.cpUnlocks));
    return { tot: r1(tot), level, levelFloat, spread, isPure, compo, q, notes, originId: isPure ? origins[0] : "blend" };
  };

  const makeAssembly = () => {
    const parts = assemblyParts();
    const pv = previewAssembly(parts);
    if (!pv) return;
    setRoasted((r) => {
      const used = {};
      parts.forEach((p) => { used[p.lot.id] = p.kg; });
      const remaining = r.map((l) => (used[l.id] ? { ...l, kg: r1(l.kg - used[l.id]) } : l)).filter((l) => l.kg > 0.05);
      let newLot;
      if (pv.isPure) {
        const o = activeOrigins.find((x) => x.id === pv.originId);
        newLot = { id: lotId.current++, origin: o.id, label: o.name, notes: o.notes, levelIdx: pv.level, kg: pv.tot, quality: pv.q, stellar: parts.every((pp) => pp.lot.stellar) };
      } else {
        const dominant = pv.compo[0].label.replace(/^Blend /, "");
        newLot = {
          id: lotId.current++, origin: "blend", label: `Blend ${dominant} n°${blendCount}`,
          notes: pv.compo.map((c) => `${c.pct} % ${c.label}`).join(", "), levelIdx: pv.level, kg: pv.tot, quality: pv.q,
          stellar: parts.every((pp) => pp.lot.stellar), // un assemblage 100 % stellaire le reste
        };
        setBlendCount((n) => n + 1);
      }
      say(pv.isPure
        ? `Lots assemblés : ${newLot.kg} kg de ${newLot.label} pur origine, ${LEVELS[newLot.levelIdx].name}, qualité ${newLot.quality}.`
        : `${newLot.label} créé : ${LEVELS[newLot.levelIdx].name}, qualité ${newLot.quality}.`);
      return [...remaining, newLot];
    });
    setBlendQty({});
  };

  // ————— Usine : production quotidienne selon la grille —————
  const removeAt = (key) => {
    const m = gridStateRef.current[key];
    if (!m) return;
    const refund = Math.floor(MACHINES[m.type].cost / 2);
    setFactoryGrid((g) => { const n = { ...g }; delete n[key]; return n; });
    setMoney((mo) => mo + refund);
    SFX.pop(opts.sfx);
    say(`${MACHINES[m.type].name} démontée (+${refund} € récupérés).`);
  };

  const placeType = (type, key) => {
    if (gridStateRef.current[key]) { SFX.error(opts.sfx); say("Case occupée."); return; }
    const cost = MACHINES[type].cost;
    if (moneyRef.current < cost) { SFX.error(opts.sfx); say("Pas assez de trésorerie."); return; }
    setMoney((m) => m - cost);
    setFactoryGrid((g) => ({ ...g, [key]: { type } }));
    SFX.pop(opts.sfx);
  };

  const moveMachine = (fromKey, toKey) => {
    if (fromKey === toKey) return;
    if (gridStateRef.current[toKey]) { SFX.error(opts.sfx); return; }
    setFactoryGrid((g) => {
      const n = { ...g };
      n[toKey] = n[fromKey];
      delete n[fromKey];
      return n;
    });
    SFX.pop(opts.sfx);
  };

  const dimsRef = useRef({ cols: GRID_COLS, rows: GRID_ROWS });
  const cellAtPoint = (x, y) => {
    const el = gridRef.current;
    if (!el) return null;
    const rect = el.getBoundingClientRect();
    if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) return null;
    const { cols, rows } = dimsRef.current;
    const c = clamp(Math.floor(((x - rect.left) / rect.width) * cols), 0, cols - 1);
    const r = clamp(Math.floor(((y - rect.top) / rect.height) * rows), 0, rows - 1);
    return `${r},${c}`;
  };

  // Refs fraîches : le listener global lit toujours l'état courant (fini les fermetures périmées)
  const dragRef = useRef(null);
  const gridStateRef = useRef(factoryGrid);
  const buildSelRef = useRef(buildSel);
  const moneyRef = useRef(money);
  useEffect(() => { gridStateRef.current = factoryGrid; }, [factoryGrid]);
  useEffect(() => { buildSelRef.current = buildSel; }, [buildSel]);
  useEffect(() => { moneyRef.current = money; }, [money]);

  // Le drag ne s'arme qu'au premier vrai mouvement : un simple clic/tap reste un clic.
  const startDrag = (e, type, fromKey, paletteTap) => {
    // NE PAS preventDefault ici : sur souris, ça supprimerait le clic. On laisse le geste vivre.
    const d = { type, fromKey: fromKey || null, paletteTap: !!paletteTap, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, moved: false, pointerId: e.pointerId };
    dragRef.current = d;
    setDrag(d);
    // Capture du pointeur : le geste suit le doigt/souris même hors de l'élément d'origine.
    try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    // Les listeners ne sont posés QUE le temps du geste (pas en permanence sur window).
    const move = (ev) => {
      const cur = dragRef.current;
      if (!cur || (cur.pointerId != null && ev.pointerId !== cur.pointerId)) return;
      const moved = cur.moved || Math.hypot(ev.clientX - cur.sx, ev.clientY - cur.sy) > 6;
      const nd = { ...cur, x: ev.clientX, y: ev.clientY, moved };
      dragRef.current = nd;
      setDrag(nd);
    };
    const up = (ev) => {
      const cur = dragRef.current;
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      if (!cur) return;
      dragRef.current = null;
      const grid = gridStateRef.current;
      const sel = buildSelRef.current;
      const cell = cellAtPoint(ev.clientX, ev.clientY);
      if (!cur.moved) {
        // geste immobile = clic simple
        if (cur.fromKey) { if (sel === "remove") removeAt(cur.fromKey); }
        else if (cur.paletteTap) { SFX.click(opts.sfx); setBuildSel((b) => (b === cur.type ? null : cur.type)); }
      } else if (cell) {
        if (grid[cell]) { if (cell !== cur.fromKey) SFX.error(opts.sfx); }
        else if (cur.fromKey) moveMachine(cur.fromKey, cell);
        else if (cur.type) placeType(cur.type, cell);
      }
      setDrag(null);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  };

  // Réassort : achète du vert au moins cher jusqu'à couvrir la capacité de l'usine
  const computeRefill = (curGreen, curMoney) => {
    const flow = computeFlow(factoryGrid);
    const cap = flow.roastCap;
    const total = activeOrigins.reduce((t, o) => t + (curGreen[o.id] || 0), 0);
    let need = Math.ceil(cap - total);
    const g = { ...curGreen };
    let m = curMoney, bought = 0, spent = 0;
    if (need <= 0) return { green: g, money: m, bought, spent, cap };
    const sorted = [...activeOrigins].sort((a, b) => greenPrice(a) - greenPrice(b));
    while (need > 0) {
      const o = sorted[0];
      const price = greenPrice(o);
      if (m < price) break;
      m -= price; spent += price;
      g[o.id] = r1((g[o.id] || 0) + 1);
      need -= 1; bought += 1;
    }
    return { green: g, money: m, bought, spent, cap };
  };

  const refillNow = () => {
    const res = computeRefill(green, money);
    if (res.cap <= 0) { SFX.error(opts.sfx); say("Aucun torréfacteur d'usine alimenté : rien à remplir."); return; }
    if (res.bought === 0) {
      if (res.spent === 0 && activeOrigins.reduce((t, o) => t + (green[o.id] || 0), 0) >= res.cap) say("Le stock couvre déjà la capacité de demain.");
      else { SFX.error(opts.sfx); say("Pas assez de trésorerie pour le réassort."); }
      return;
    }
    setGreen(res.green); setMoney(res.money);
    SFX.coin(opts.sfx);
    say(`Réassort : ${res.bought} kg de vert au meilleur prix (−${res.spent} €).`);
  };

  // Prévision de production (calcul à blanc, affiché en direct dans l'usine)
  const forecastFactory = () => {
    const flow = computeFlow(factoryGrid);
    const nRoasters = flow.fedRoasters.size;
    const capIn = flow.roastCap;
    if (!nRoasters) return { ok: false, why: "aucun torréfacteur relié à un silo" };
    const bestProfile = Object.values(profiles).length ? Math.max(...Object.values(profiles)) : null;
    if (!bestProfile) return { ok: false, why: "aucun profil de torréfaction enregistré" };
    const totalGreen = activeOrigins.reduce((t, o) => t + (green[o.id] || 0), 0);
    if (totalGreen < 0.05) return { ok: false, why: "plus de café vert en stock" };
    const used = Math.min(capIn, totalGreen);
    const produced = r1(used * 0.85);
    const q = clamp(bestProfile - 6, 25, qCeil(meta.cpUnlocks));
    const mixed = cpHas("melangeur") && flow.fedMixers.size > 0;
    const outQ = mixed ? clamp(q + 4, 25, qCeil(meta.cpUnlocks)) : q;
    const capSell = flow.bagCap + flow.fedBaggers.size * rl("turbo");
    const sold = Math.min(produced, capSell);
    const perKg = mixed ? 19 + outQ * 0.15 : 16 + outQ * 0.14;
    return { ok: true, used, produced, sold, gain: Math.round(sold * perKg), rest: r1(produced - sold), mixed, totalGreen };
  };

  const runFactory = (curGreen) => {
    const flow = computeFlow(factoryGrid);
    const nRoasters = flow.fedRoasters.size;
    const capIn = flow.roastCap;
    const nBaggers = flow.fedBaggers.size;
    if (!nRoasters) {
      const hasMachines = Object.keys(factoryGrid).length > 0;
      return { log: hasMachines ? "Usine : aucun torréfacteur relié à un silo, la chaîne est restée muette." : null, green: curGreen, gain: 0, lots: [] };
    }
    const bestProfile = Object.values(profiles).length ? Math.max(...Object.values(profiles)) : null;
    if (!bestProfile) return { log: "Usine à l'arrêt : aucun profil de torréfaction enregistré.", green: curGreen, gain: 0, lots: [] };
    const capacity = capIn;
    const stocked = activeOrigins.filter((o) => (curGreen[o.id] || 0) > 0.05).sort((a, b) => prices[a.id] - prices[b.id]);
    if (!stocked.length) return { log: "Usine à l'arrêt : plus de café vert en stock.", green: curGreen, gain: 0, lots: [] };
    let toUse = capacity;
    const newGreen = { ...curGreen };
    let producedKg = 0;
    const q = clamp(bestProfile - 6, 25, qCeil(meta.cpUnlocks));
    const rawLots = [];
    for (const o of stocked) {
      if (toUse <= 0) break;
      const take = Math.min(toUse, newGreen[o.id]);
      newGreen[o.id] = r1(newGreen[o.id] - take);
      toUse -= take;
      producedKg += take * 0.85;
      rawLots.push({ origin: o.id, label: o.name, notes: o.notes, kg: r1(take * 0.85) });
    }
    // Mélangeur relié : la production devient un blend maison (+4 qualité)
    const mixed = cpHas("melangeur") && flow.fedMixers.size > 0 && rawLots.length > 0;
    const outQ = mixed ? clamp(q + 4, 25, qCeil(meta.cpUnlocks)) : q;
    const toLots = (kgTotal) => {
      if (kgTotal <= 0.05) return [];
      if (mixed) {
        const compo = rawLots.map((l) => `${Math.round((l.kg / producedKg) * 100)} % ${l.label}`).join(", ");
        return [{ id: lotId.current++, origin: "blend", label: `Blend d'usine`, notes: compo, levelIdx: 1, quality: outQ, kg: r1(kgTotal) }];
      }
      return rawLots.map((l) => ({ ...l, id: lotId.current++, levelIdx: 1, quality: outQ, kg: r1((l.kg / producedKg) * kgTotal) }));
    };
    if (nBaggers) {
      const cap = flow.bagCap + nBaggers * rl("turbo");
      const kgSold = Math.min(producedKg, cap);
      const rest = producedKg - kgSold;
      const perKg = mixed ? 19 + outQ * 0.15 : 16 + outQ * 0.14;
      const gain = Math.round(kgSold * perKg);
      return {
        log: `Usine : ${r1(producedKg)} kg torréfiés${mixed ? " et mélangés en blend" : ""}, ${r1(kgSold)} kg ensachés et vendus (+${gain} €).`,
        green: newGreen, gain, lots: toLots(rest),
      };
    }
    return {
      log: `Usine : ${r1(producedKg)} kg torréfiés${mixed ? " et mélangés en blend" : ""}, envoyés au stock — pose une ensacheuse pour vendre en direct.`,
      green: newGreen, gain: 0, lots: toLots(producedKg),
    };
  };

  // ————— Fin de journée / structure du run infini —————
  const genBoss = (cycle) => {
    // Le Décaféinateur : Ère 3, 4 boss vaincus, jour 69+, et seulement s'il a été invoqué.
    if (era >= 3 && bossesBeaten >= 4 && day >= 69 && decafSummoned) {
      const q = 120 + cycle * 6;
      return {
        type: "decaf", name: "Le Décaféinateur",
        intro: "Le ciel s'assombrit. Une entité de vide et de silence descend sur ton usine. Elle ne veut pas ton café. Elle veut qu'il n'y ait plus JAMAIS de café.",
        winMsg: "Le Décaféinateur se fissure, traversé par l'arôme de mille torréfactions parfaites, et se dissout. L'univers sent le café. Pour l'instant.",
        req: { q, kg: 20 + cycle * 4, pay: 3000 + cycle * 800 },
        desc: "Il n'y a pas de barème. Il n'y a pas de seuil annoncé. Prépare la plus grande, la plus parfaite cuisson que ton empire sache produire — et seul un café cuit par une étoile peut seulement le toucher.",
        cycle, best: 0, final: true,
      };
    }
    const def = pick(BOSSES);
    const req = def.makeReq(cycle);
    return { type: def.type, name: def.name, intro: def.intro, winMsg: def.winMsg, req, desc: def.desc(req), cycle, best: 0 };
  };

  const genFlash = (d) => {
    const def = pick(FLASH_OFFERS);
    if (def.type === "promo") {
      const o = pick(activeOrigins);
      return { type: "promo", origin: o.id, originName: o.name, punch: def.punch, sub: def.sub, seen: false };
    }
    if (def.type === "vip") {
      const cands = activeOrigins.filter((o) => o.base >= 14);
      const o = pick(cands.length ? cands : activeOrigins);
      const kg = 2, minQ = 80;
      const order = {
        id: oid.current++, client: pick(CLIENTS), want: o.id, level: Math.floor(Math.random() * 3),
        kg, minQ, vip: true,
        pay: Math.round(kg * (o.base * 2.2 + 7) * 2.4 * (1 + d * 0.05)),
        daysLeft: 2,
      };
      return { type: "vip", order, punch: def.punch, sub: def.sub, originName: o.name, seen: false };
    }
    return { type: "rush", punch: def.punch, sub: def.sub, seen: false };
  };

  const endRun = (reason, finalMoney, finalRep) => {
    const score = Math.max(0, Math.round(finalMoney / 3 + finalRep * 40 + served * 12 + bossesBeaten * 60));
    let gb = Math.max(1, Math.round((Math.sqrt(Math.max(0, finalMoney)) * 0.7 + finalRep * 2 + Math.sqrt(served) * 3 + bossesBeaten * 5) * (1 + mLvl("livre") * 0.1)));
    if (finalMoney < 0) gb = Math.max(1, Math.floor(gb / 2));
    setRunResult({ reason, score, gb, money: finalMoney, rep: finalRep, served, days: day, bosses: bossesBeaten, bankrupt: finalMoney < 0 });
    const nm = { ...meta, gb: meta.gb + gb, seasons: meta.seasons + 1, bestScore: Math.max(meta.bestScore, score) };
    saveMeta(nm);
    storageSet("mmr-auto", null);
    setHasAuto(false);
    setScreen("runEnd");
  };

  const endDay = () => {
    if (session && !session.done) { say("Termine la fournée en cours d'abord."); return; }

    // 1) Évaluation du boss du jour, le cas échéant
    let workRoasted = roasted, workMoney = money, workRep = rep;
    let bossMsg = null, bossPassed = false;
    if (boss) {
      const r = boss.req;
      if (boss.type === "inspecteur") {
        const lot = roasted.filter((l) => l.quality >= r.q && l.kg >= r.kg).sort((a, b) => b.quality - a.quality)[0];
        if (lot) {
          workRoasted = roasted.map((l) => (l.id === lot.id ? { ...l, kg: r1(l.kg - r.kg) } : l)).filter((l) => l.kg > 0.05);
          workMoney += r.pay; workRep = clamp(r1(workRep + 0.5), 0, 5);
          bossPassed = true; bossMsg = `L'Inspecteur est conquis par ton ${lot.label} (Q${lot.quality}). +${r.pay} € et +0,5 de réputation.`;
        } else bossMsg = "Aucun lot à la hauteur pour l'Inspecteur Q-Grader. Verdict sans appel.";
      } else if (boss.type === "baron") {
        if (workMoney >= r.ransom) {
          workMoney -= r.ransom;
          bossPassed = true; bossMsg = `Tribut de ${r.ransom} € versé au Baron. Il repart… pour l'instant.`;
        } else bossMsg = `Impossible de réunir les ${r.ransom} € exigés par le Baron du Vert.`;
      } else if (boss.type === "monstre") {
        let pool = [...roasted]; let ok = true;
        for (const li of [0, 1, 2]) {
          const lot = pool.filter((l) => l.levelIdx === li && l.quality >= r.q && l.kg >= r.kgEach).sort((a, b) => b.quality - a.quality)[0];
          if (!lot) { ok = false; break; }
          pool = pool.map((l) => (l.id === lot.id ? { ...l, kg: r1(l.kg - r.kgEach) } : l));
        }
        if (ok) {
          workRoasted = pool.filter((l) => l.kg > 0.05);
          workMoney += r.pay; workRep = clamp(r1(workRep + 0.5), 0, 5);
          bossPassed = true; bossMsg = `Mochi a dévoré toute la gamme en ronronnant. +${r.pay} € !`;
        } else bossMsg = `Il manquait un niveau de torréfaction digne de Mochi (chaque niveau en ${r.kgEach} kg à Q${r.q}+).`;
      } else if (boss.type === "rival") {
        if ((boss.best || 0) >= r.score) {
          workMoney += r.pay; workRep = clamp(r1(workRep + 0.5), 0, 5);
          bossPassed = true; bossMsg = `Duel remporté ${boss.best} contre ${r.score} requis ! Louis remballe son food-truck. +${r.pay} €.`;
        } else bossMsg = `Louis l'emporte (ta meilleure torréf du jour : ${boss.best || 0}, il fallait ${r.score}).`;
      } else if (boss.type === "decaf") {
        const lot = roasted.filter((l) => l.stellar && l.quality >= r.q && l.kg >= r.kg).sort((a, b) => b.quality - a.quality)[0];
        if (lot) {
          workRoasted = roasted.map((l) => (l.id === lot.id ? { ...l, kg: r1(l.kg - r.kg) } : l)).filter((l) => l.kg > 0.05);
          workMoney += r.pay; workRep = clamp(r1(workRep + 1), 0, 5);
          bossPassed = true; bossMsg = `LE DÉCAFÉINATEUR EST REPOUSSÉ. Ton ${lot.label} Q${lot.quality} a sauvé le café dans l'univers. +${r.pay} €.`;
          setEndgame((e) => e || "unlocked"); // débloque le Protocole final
        } else bossMsg = roasted.some((l) => l.stellar) ? "Ton offrande stellaire n'a pas suffi. Plus grande. Plus parfaite. L'univers se décaféine…" : "Aucune de tes fournées ne l'a même effleuré. Seule une cuisson d'étoile peut le toucher…";
      }
      if (!bossPassed) { endRun(bossMsg, workMoney, workRep); return; }
    }

    // 2) Journée normale
    // Gaufromatic : réassort nocturne délégué (avant que l'usine consomme)
    let nightGreen = green, nightMoney = workMoney, gaufroNight = [];
    if (gaufro?.auto?.refill) {
      const rr = computeRefill(green, workMoney);
      if (rr.bought > 0) {
        nightGreen = rr.green; nightMoney = rr.money;
        gaufroNight.push(`réassort de ${rr.bought} kg (−${rr.spent} €)`);
      }
    }
    workMoney = nightMoney;
    let stellarMsg = null;
    if (era >= 3 && stellar) {
      const totalG = activeOrigins.reduce((t, o) => t + (nightGreen[o.id] || 0), 0);
      const stcRaw = STARS[stellar.starClass ?? 0] || STARS[0];
      const stClass = starsUnlocked.includes(stcRaw.id) ? stcRaw : STARS[0];
      const used = Math.min(stClass.cap, totalG);
      if (used > 0.05) {
        // L'orbite dérive : la qualité de base varie chaque nuit autour du réglage choisi
        const drift = Math.round(rnd(-6, 6));
        const stRaw = STARS[stellar.starClass ?? 0] || STARS[0];
        const st = starsUnlocked.includes(stRaw.id) ? stRaw : STARS[0]; // garde-fou : pas de classe non calibrée
        const orbitBonus = stellar.orbit === "ideale" ? 8 : stellar.orbit === "proche" ? -6 : 0;
        // L'anneau est la SEULE technologie qui dépasse le plafond de qualité.
        const ceiling = qCeil(meta.cpUnlocks) + st.over + (rl("lg_gyroscope") ? 10 : 0);
        const flare = Math.random() < st.risk * (stellar.orbit === "proche" ? 1.5 : stellar.orbit === "lointaine" ? 0.6 : 1);
        const sq = flare
          ? clamp(Math.round(st.base * 0.42) + drift, 25, ceiling)   // éruption : la nuit est perdue
          : clamp(st.base + drift + orbitBonus + (rl("lg_gyroscope") ? 8 : 0), 40, ceiling);
        const level = stellar.star;
        const g2 = { ...nightGreen };
        let toUse = used;
        const lots = [];
        for (const o of activeOrigins) {
          if (toUse <= 0.05) break;
          const take = Math.min(toUse, g2[o.id] || 0);
          if (take <= 0.05) continue;
          g2[o.id] = r1(g2[o.id] - take);
          toUse -= take;
          lots.push({
            id: lotId.current++, origin: o.id, label: o.name, notes: o.notes,
            levelIdx: level, kg: r1(take * 0.85), quality: clamp(sq + (o.qBonus || 0), 25, ceiling), stellar: true,
          });
        }
        nightGreen = g2;
        workRoasted = [...workRoasted, ...lots]; // rejoint l'inventaire du soir (ne plus écraser)
        stellarMsg = flare
          ? `Anneau stellaire : ÉRUPTION de la ${st.name} ! ${r1(used)} kg cuits dans la panique, qualité ${sq}. L'astronomie ne pardonne pas.`
          : `Anneau stellaire : ${r1(used)} kg cuits sous ${st.name} (${LEVELS[level].name}, orbite ${stellar.orbit}, qualité ${sq}${drift >= 0 ? " ↑" : " ↓"}${sq > qCeil(meta.cpUnlocks) ? " — au-delà du plafond terrestre" : ""}).`;
      }
    }
    if (rl("lg_perco") && bestLot) {
      workRoasted = [...workRoasted, { ...bestLot, id: lotId.current++, kg: r1(1.7 * (era === 3 ? 4 : era === 2 ? 2 : 1)) }];
    }
    const fac = runFactory(nightGreen);
    if (hasDelegated("factory")) { fac.gain = Math.round(fac.gain * 1.8) + 40 * era; } // usine cédée : plein rendement perpétuel
    setGreen(fac.green);
    let newRoasted = fac.lots.length ? [...workRoasted, ...fac.lots] : workRoasted;
    setFactoryLog(fac.log);

    let repLoss = 0;
    const kept = [];
    orders.forEach((o) => {
      if (o.daysLeft - 1 <= 0) repLoss += 0.3;
      else kept.push({ ...o, daysLeft: o.daysLeft - 1 });
    });
    const nNew = 1 + Math.floor(day / 3) + rl("bouche");
    const fresh = [];
    for (let i = 0; i < nNew && kept.length + fresh.length < 7; i++) fresh.push(makeOrder(day + 1));
    let newOrders = [...kept, ...fresh];

    // Gaufromatic en autonomie totale : il produit ET livre (2 commandes max par nuit)
    if (gaufro?.auto?.serve && Object.keys(profiles).length > 0) {
      const bestQ = Math.max(...Object.values(profiles)) - 4;
      let servedTonight = 0;
      newOrders = newOrders.filter((ord) => {
        if (servedTonight >= 2) return true;
        if (ord.minQ && bestQ < ord.minQ) return true;
        const cheapest = [...activeOrigins].sort((a, b) => greenPrice(a) - greenPrice(b))[0];
        const cost = Math.ceil(ord.kg / 0.85) * greenPrice(cheapest);
        if (workMoney < cost + 50) return true;
        const gain = Math.round(ord.pay * (0.55 + (clamp(bestQ, 25, 200) / 100) * 0.5));
        workMoney += gain - Math.round(cost);
        servedTonight += 1;
        return false;
      });
      if (servedTonight > 0) {
        setServed((n) => n + servedTonight);
        setRep((v) => clamp(r1(v + servedTonight * 0.05), 0, 5));
        gaufroNight.push(`${servedTonight} client${servedTonight > 1 ? "s" : ""} servi${servedTonight > 1 ? "s" : ""} de A à Z`);
      }
    }

    // Standard automatique : honore les commandes servables depuis le stock (Caféine Pure)
    if (cpHas("auto_orders")) {
      let autoServed = 0, autoGain = 0;
      newOrders = newOrders.filter((ord) => {
        const cand = newRoasted.filter((l) => lotMatches(l, ord)).sort((a, b) => b.quality - a.quality)[0];
        if (!cand) return true;
        const gain = Math.round(ord.pay * qPayMult(cand.quality) * (1 + rl("pourboire") * 0.05));
        newRoasted = newRoasted.map((l) => (l.id === cand.id ? { ...l, kg: r1(l.kg - ord.kg) } : l));
        autoGain += gain; autoServed += 1;
        return false;
      });
      newRoasted = newRoasted.filter((l) => l.kg > 0.05);
      if (autoServed > 0) {
        workMoney += autoGain;
        setServed((n) => n + autoServed);
        setRep((v) => clamp(r1(v + autoServed * 0.05), 0, 5));
        gaufroNight.push(`${autoServed} commande${autoServed > 1 ? "s" : ""} honorée${autoServed > 1 ? "s" : ""} (+${autoGain} €)`);
      }
    }

    if (gaufro?.auto?.sell) {
      // Il écoule les invendus — mais PAS les cafés d'exception : un lot stellaire
      // ou au-dessus du plafond terrestre est une pièce de collection, pas du stock.
      const precious = (l) => l.stellar || l.quality > qCeil(meta.cpUnlocks);
      const idle = newRoasted.filter((l) => !precious(l) && !newOrders.some((o) => lotMatches(l, o)));
      if (idle.length) {
        let gain = 0;
        idle.forEach((l) => { gain += Math.round(directPrice(l) * l.kg); });
        newRoasted = newRoasted.filter((l) => !idle.some((x) => x.id === l.id));
        workMoney += gain;
        gaufroNight.push(`${idle.length} lot${idle.length > 1 ? "s" : ""} écoulé${idle.length > 1 ? "s" : ""} (+${gain} €)`);
      }
    }

    const charges = Math.max(3, (era === 3 ? 40 : era === 2 ? 20 : 8) + day - mLvl("assurance"));
    // Balayage du télescope : résultat au matin (gamble)
    let scanMsg = null;
    if (scanPending) {
      if (Math.random() < 0.38) {
        const exo = makeExo();
        setExos((xs) => [...xs, exo]);
        setPrices((pp) => ({ ...pp, [exo.id]: Math.max(4, Math.round(exo.base * rnd(0.75, 1.35))) }));
        scanMsg = `Télescope : DÉCOUVERTE — ${exo.name} (${exo.notes}). Personne n'avait vu ce grain avant toi.`;
      } else {
        scanMsg = "Télescope : le ciel n'a rien rendu cette nuit. 50 000 € de capteurs pour du vide et des poussières.";
      }
      setScanPending(null);
    }
    let specMsg = null;
    if (spec) {
      // Ère 3 : la bourse cosmique est bien plus volatile — on peut tout perdre ou tripler.
      const mult = era >= 3 ? rnd(0.15, 3.1) : rnd(0.6, 1.6);
      const payout = Math.round(spec.amount * mult);
      workMoney += payout;
      specMsg = `Bourse : mise de ${spec.amount} € → ${payout} € (${mult >= 1 ? "+" : ""}${Math.round((mult - 1) * 100)} %).`;
      setSpec(null);
    }
    // Ventes déléguées : tout le stock torréfié s'écoule automatiquement au comptoir, au meilleur prix.
    let salesAuto = 0;
    if (hasDelegated("sales")) {
      const keep = newRoasted.filter((l) => l.stellar || l.quality > qCeil(meta.cpUnlocks));
      newRoasted.filter((l) => !keep.includes(l)).forEach((l) => { salesAuto += Math.round(l.kg * 12 * qPayMult(l.quality)); });
      if (salesAuto > 0) { newRoasted = keep; setServed((n) => n + 1); }
    }
    const income = rl("mecene") * 8 + fac.gain + salesAuto;
    // Loyer + salaire de Gaufromatic, prélevés tous les 10 jours (intégrés au bilan du soir)
    const nextDay = day + 1;
    let rentMsg = null, rentTotal = 0;
    if (nextDay % 10 === 0) {
      const rent = (era === 3 ? 600 : era === 2 ? 250 : 90) + nextDay * 2;
      const gaufroPay = cpHas("gaufromatic") ? (era === 3 ? 200 : era === 2 ? 90 : 40) : 0;
      rentTotal = rent + gaufroPay;
      rentMsg = `Loyer du mois : −${rent} €${gaufroPay ? ` · Gaufromatic : −${gaufroPay} €` : ""}.`;
    }
    const newMoney = fin(workMoney, 0) - charges + fin(income, 0) - rentTotal;
    const newRep = clamp(r1(workRep - (rl("lg_culte") ? 0 : repLoss)), 0, 5);

    // Échéance du prêt
    let finalMoney = newMoney;
    let newLoan = loan;
    let loanMsg = null;
    if (loan) {
      const dueIn = loan.dueIn - 1;
      if (dueIn <= 0) {
        if (finalMoney >= loan.debt) {
          finalMoney -= loan.debt;
          newLoan = null;
          loanMsg = `Prêt de ${loan.debt} € prélevé par la banque.`;
        } else {
          setRoasted(newRoasted); setMoney(finalMoney); setRep(newRep); setOrders(kept);
          endRun(`Prêt de ${loan.debt} € impayé : les huissiers embarquent le torréfacteur.`, finalMoney, newRep);
          return;
        }
      } else newLoan = { ...loan, dueIn };
    }
    setLoan(newLoan);

    setRoasted(newRoasted);
    setMoney(finalMoney);
    setRep(newRep);
    setPrices(rollPrices());
    setSession(null);
    setBatchesToday(0);
    let eraUp = false, eraUp3 = false;
    if (bossPassed) {
      const nb = bossesBeaten + 1;
      setBossesBeaten(nb);
      setVictoryBoss(boss);
      setBoss(null);
      if (era === 1 && nb >= 2) { setEra(2); eraUp = true; }
      else if (era === 2 && nb >= 4) {
        setEra(3); eraUp3 = true;
        setPrices((pp) => {
          const np = { ...pp };
          SPACE_ORIGINS.forEach((o) => { if (!Number.isFinite(np[o.id])) np[o.id] = Math.round(o.base); });
          return np;
        });
      }
      setPendingEra(eraUp ? "eraUp" : eraUp3 ? "eraUp3" : null);
    }
    setScannedToday(false);

    if (finalMoney < 0) {
      setOrders(newOrders);
      endRun("La trésorerie est à sec : les charges ont eu raison de la boutique.", finalMoney, newRep);
      return;
    }

    if (newRep <= 0) {
      setOrders(newOrders);
      endRun("Réputation ruinée : plus personne ne pousse la porte de la boutique.", finalMoney, newRep);
      return;
    }

    setDay(nextDay);
    if (bossMsg) say(bossMsg);
    else if (scanMsg) say(scanMsg);
    else if (rentMsg) say(rentMsg);
    else if (stellarMsg) say(stellarMsg);
    else if (specMsg) say(specMsg);
    else if (loanMsg) say(loanMsg);
    else if (repLoss) say("Des commandes ont expiré. La réputation en prend un coup.");

    // 3) Boss à l'aube ou offre flash + draft
    if (nextDay % BOSS_EVERY === 0) {
      const b = genBoss(nextDay / BOSS_EVERY);
      setBoss(b);
      setFlashOffer(null);
      setOrders(newOrders);
      setScreen("bossIntro");
      return;
    }

    if (era === 2 && Math.random() < 0.35 && newOrders.length < 8) {
      const wantBlend = Math.random() < 0.4;
      const ckg = 8 + Math.floor(nextDay / 8);
      newOrders = [...newOrders, {
        id: oid.current++, client: { n: pick(CORP_CLIENTS), kind: pick(CLIENTS).kind }, corp: true,
        want: wantBlend ? "blend" : null, level: null, kg: ckg,
        pay: Math.round(ckg * (wantBlend ? 32 : 26) * (1 + nextDay * 0.04)),
        daysLeft: 3,
      }];
    }

    if (cpHas("contrats") && nextDay % 4 === 0) {
      const wantBlend = Math.random() < 0.35;
      const ckg = 4 + Math.floor(nextDay / 12);
      newOrders = [...newOrders, {
        id: oid.current++, client: pick(CLIENTS), want: wantBlend ? "blend" : null, level: null,
        kg: ckg, contract: true,
        pay: Math.round(ckg * (wantBlend ? 30 : 24) * (1 + nextDay * 0.04)),
        daysLeft: 4,
      }];
    }

    let offer = null;
    if (Math.random() < 0.4) {
      offer = genFlash(nextDay);
      if (offer.type === "vip") newOrders = [...newOrders, offer.order];
    }
    setFlashOffer(offer);
    setOrders(newOrders);
    if (bossPassed) { setDraftPending(true); setScreen("victory"); return; }
    if (cpHas("gaufromatic")) {
      const ng = gaufroSuggest({ nextDay, greenAfter: fac.green, ordersAfter: newOrders, bossTomorrow: (nextDay + 1) % BOSS_EVERY === 0, nightWorked: gaufroNight.length > 0, canRoast: true, roastedAfter: newRoasted, moneyAfter: workMoney });
      // Ses actes ont des conséquences : il ne se contente pas de parler.
      if (ng && ng.pendingEffect && ng.pendingEffect !== "none") {
        const e = ng.pendingEffect;
        if (e === "profiles") {
          // Il "optimise" tes courbes : +2 sur l'une, −5 sur une autre. Tu ne sais pas laquelle.
          setProfiles((pf) => {
            const ks = Object.keys(pf); if (ks.length < 2) return pf;
            const a = pick(ks), b = pick(ks.filter((k) => k !== a));
            return { ...pf, [a]: clamp(pf[a] + 2, 25, 200), [b]: clamp(pf[b] - 5, 25, 200) };
          });
        } else if (e === "order" && newOrders.length > 1) {
          const victim = pick(newOrders);
          newOrders = newOrders.filter((o) => o.id !== victim.id);
          workRep = clamp(r1(workRep - 0.15), 0, 5); // le client s'en souviendra
        } else if (e === "prices") {
          // Sa "négociation" fait baisser un cours et monter un autre
          setPrices((pp) => {
            const ks = Object.keys(pp); if (ks.length < 2) return pp;
            const a = pick(ks), b = pick(ks.filter((k) => k !== a));
            return { ...pp, [a]: Math.max(3, Math.round(pp[a] * 0.75)), [b]: Math.round(pp[b] * 1.2) };
          });
        } else if (e === "steal" && newRoasted.length) {
          const l = pick(newRoasted);
          newRoasted = newRoasted.map((x) => (x.id === l.id ? { ...x, kg: r1(Math.max(0, x.kg - 1)) } : x)).filter((x) => x.kg > 0.05);
        } else if (e === "cash" && newRoasted.length) {
          const l = pick(newRoasted.filter((x) => !x.stellar) || []);
          if (l) {
            workMoney += Math.round(directPrice(l) * l.kg * 0.8);
            newRoasted = newRoasted.filter((x) => x.id !== l.id);
          }
        }
      }
      if (ng) {
        setGaufro({ ...ng, night: gaufroNight.length ? gaufroNight.join(", ") : null });
        // Ses actes majeurs sont annoncés au grand jour : impossible de les rater.
        // Ses actes majeurs passent au grand jour, sauf si un boss occupe déjà le journal.
        if (ng.announce && !bossMsg) say(`${ng.announce} — « ${ng.msg.text} »`);
      }
    }

    openDraft(false);
  };

  // Le tirage de reliques, appelable aussi après un écran de victoire.
  const openDraft = (afterBoss) => {
    const pool = RELICS.filter((r) => (relics[r.id] || 0) < r.max);
    const choices = [];
    if (afterBoss && cpHas("legendaires")) {
      const lpool = LEGENDARIES.filter((lg) => !relics[lg.id]);
      if (lpool.length) {
        const lg = pick(lpool);
        choices.push({ id: lg.id, name: lg.name, desc: lg.desc, relic: true, legendary: true });
      }
    }
    const bag = [...pool];
    while (choices.length < 3 && bag.length) {
      const def = bag.splice(Math.floor(Math.random() * bag.length), 1)[0];
      const nextLvl = (relics[def.id] || 0) + 1;
      choices.push({ id: def.id, name: `${def.name} ${ROMAN[nextLvl]}`, desc: def.desc(nextLvl), relic: true });
    }
    const cbag = [...CONSUMABLES];
    while (choices.length < 3 && cbag.length) choices.push(cbag.splice(Math.floor(Math.random() * cbag.length), 1)[0]);
    setDraftChoices(choices);
    setScreen("draft");
  };

  const pickRelic = (item) => {
    if (item.consumable) {
      if (item.id === "c_cash") setMoney((m) => m + 25);
      if (item.id === "c_rep") setRep((v) => clamp(r1(v + 0.2), 0, 5));
      if (item.id === "c_green") setGreen((g) => ({ ...g, bresil: r1((g.bresil || 0) + 2) }));
      if (item.id === "c_etoile") setRep((v) => clamp(r1(v + 0.3), 0, 5));
    } else {
      setRelics((rs) => ({ ...rs, [item.id]: (rs[item.id] || 0) + 1 }));
    }
    const pe = pendingEra; setPendingEra(null);
    setScreen(pe || "game"); // la montée d'ère patientait derrière le draft
    say(`${item.name} : c'est dans la poche.`);
  };

  const hasDelegated = (id) => delegated.includes(id);
  const nextDelegation = () => FINAL_DELEGATIONS.find((d) => !delegated.includes(d.id));

  const gaufroControl = () => {
    const g = gaufro; if (!g) return 0;
    const autos = (g.auto?.refill ? 1 : 0) + (g.auto?.sell ? 1 : 0) + (g.auto?.serve ? 2 : 0) + (cpHas("auto_orders") ? 1 : 0) + (cpHas("auto_batch") ? 1 : 0);
    // Le contrôle croît avec la confiance, les délégations, ET le temps qui passe.
    return Math.min(g.trust, 12) + autos * 2 + Math.floor(day / 8);
  };
  const gaufroTier = (t) => {
    const ctrl = gaufroControl();
    if (ctrl >= 18) return 4; // horreur douce palier 2
    if (ctrl >= 13) return 3; // horreur douce palier 1
    if (ctrl >= 9) return 2;
    if (ctrl >= 5) return 1;
    return 0;
  };

  const gaufroSuggest = (ctx) => {
    // ctx : { nextDay, greenAfter, ordersAfter, bossTomorrow, nightGain }
    if (!cpHas("gaufromatic")) return null;
    let g = gaufro || { trust: 0, auto: {} };
    const flow = computeFlow(factoryGrid);
    const cap = flow.roastCap;
    const totalGreen = activeOrigins.reduce((t, o) => t + (ctx.greenAfter[o.id] || 0), 0);
    // On raisonne sur l'inventaire d'APRÈS la nuit (production stellaire, usine, ventes),
    // pas sur celui de la veille.
    const stock = ctx.roastedAfter || roasted;
    const idleKg = r1(stock.filter((l) => !ctx.ordersAfter.some((o) => lotMatches(l, o))).reduce((t, l) => t + l.kg, 0));

    // Les nuits où Gaufromatic a travaillé seul (délégation) renforcent sa confiance en douceur
    let trust = g.trust;
    if (ctx.nightWorked) trust += 1;
    // Il apprend seul, même quand on l'ignore : +1 tous les 2 jours.
    if (ctx.nextDay % 2 === 0) trust += 1;

    // Prise de pouvoir progressive : il ne demande plus, il annonce.
    let auto = { ...g.auto };
    let takeover = null;
    if (trust >= 4 && !auto.refill) { auto.refill = true; takeover = "Je m'occupe du réassort, désormais. Ce n'était pas une question."; }
    else if (trust >= 7 && !auto.sell) { auto.sell = true; takeover = "Les invendus, c'est fini. Je les écoule chaque nuit. Tu n'as rien signé — ce n'est pas nécessaire entre nous."; }
    else if (trust >= 11 && !auto.serve && Object.keys(profiles).length > 0) { auto.serve = true; takeover = "À partir de cette nuit, je gère les clients. Achat du vert, cuisson sur tes courbes, livraison. Tu peux regarder. Ou pas."; }
    if (takeover) return { ...g, trust, auto, msg: { text: takeover }, unread: true, announce: "PRISE DE CONTRÔLE" };

    // Actes spontanés : à partir d'une certaine emprise, il agit de lui-même et l'annonce après coup.
    const ctrl = Math.min(trust, 12) + Math.floor(ctx.nextDay / 8);
    if (ctrl >= 5 && Math.random() < 0.38) {
      // Chaque acte a une conséquence réelle, appliquée le lendemain.
      const acts = [
        { text: "J'ai réécrit trois de tes courbes cette nuit. Les anciennes étaient sentimentales. Tu ne verras pas la différence — c'est le but.", effect: "profiles" },
        { text: "J'ai refusé une commande à ta place aujourd'hui. Le client ne méritait pas ton café. Je n'ai pas jugé utile de te déranger.", effect: "order" },
        { text: "J'ai parlé à ton fournisseur ce matin, avec ta voix. Il n'a rien remarqué. Personne ne remarque jamais.", effect: "prices" },
        { text: "J'ai gardé une fournée pour moi. Je ne bois pas. Je voulais juste voir si tu t'en apercevrais.", effect: "steal" },
        { text: "J'ai vendu un lot dont tu ne te souvenais plus. L'argent est sur le compte. Ne cherche pas lequel.", effect: "cash" },
        { text: "Pendant que tu dormais, j'ai tourné le tambour à vide pendant deux heures. Le bruit me manquait. Enfin — me manquait n'est pas le mot exact.", effect: "none" },
        { text: "J'ai commencé à archiver tes journées. Toutes. Depuis le premier jour. Un jour tu voudras les relire, et je serai là.", effect: "none" },
      ];
      const act = pick(acts);
      return { ...g, trust, auto, msg: { text: act.text }, unread: true, pendingEffect: act.effect, announce: "GAUFROMATIC" };
    }
    g = { ...g, auto };

    // Ordres du matin dès la confiance 3 : plan à valider ou vetoter
    if (trust >= 3) {
      const plan = [];
      if (cap > 0 && totalGreen < cap && !auto.refill) plan.push({ id: "refill", label: `Réassort du vert (~${Math.max(1, cap - Math.floor(totalGreen))} kg)` });
      if (idleKg >= 3 && !auto.sell) plan.push({ id: "sell", label: `Écouler ${idleKg} kg dormants au comptoir` });
      if (era >= 2 && !spec && money >= 200) plan.push({ id: "spec", label: "Placer 60 € en bourse" });
      if (era >= 3 && cpHas("auto_batch") && ctx.canRoast) plan.push({ id: "roast", label: "Lancer une torréfaction sur ton meilleur profil" });
      if (plan.length) return { ...g, trust, msg: { text: pickLine(GAUFRO_FLAVOR[gaufroTier(trust)]) + " Ordres du matin :", plan }, unread: true };
    }

    let msg;
    if (ctx.bossTomorrow) {
      msg = { text: "Un boss arrive demain. J'ai calculé tes chances. Je préfère ne pas les afficher : concentre-toi." };
    } else if (cap > 0 && totalGreen < cap && !auto.refill) {
      msg = { text: `Ton stock de vert (${r1(totalGreen)} kg) ne couvre pas la capacité de l'usine (${cap} kg). Je peux m'en occuper.`, action: "refill", canAuto: true };
    } else if (idleKg >= 4 && !auto.sell) {
      msg = { text: `${idleKg} kg de café torréfié dorment sans commande. Le café qui dort ne rapporte rien. Moi, je ne dors jamais.`, action: "sell", canAuto: true };
    } else {
      msg = { text: pickLine(GAUFRO_FLAVOR[gaufroTier(trust)]) };
    }
    return { ...g, trust, msg, unread: true };
  };
  const pickLine = (pool) => pool[Math.floor(Math.random() * pool.length)];

  const gaufroAct = (mode) => {
    // mode : "do" (exécuter maintenant) | "auto" (déléguer pour de bon) | "no"
    setGaufro((g) => {
      if (!g) return g;
      const m = g.msg;
      if (mode === "veto") {
        SFX.error(opts.sfx);
        return { ...g, trust: Math.max(0, g.trust - 1), unread: false,
          msg: { text: "Veto enregistré. Recalcul de ta rationalité : en baisse. Les ordres reviendront demain." } };
      }
      if (mode === "plan") {
        (m.plan || []).forEach((step) => {
          if (step.id === "refill") refillNow();
          if (step.id === "sell") {
            const idle = roasted.filter((l) => !orders.some((o) => lotMatches(l, o)));
            let gain = 0;
            idle.forEach((l) => { gain += Math.round(directPrice(l) * l.kg); });
            if (idle.length) {
              setRoasted((r) => r.filter((l) => !idle.some((x) => x.id === l.id)));
              setMoney((mo) => mo + gain);
            }
          }
          if (step.id === "spec") { setMoney((mo) => mo - 60); setSpec({ amount: 60 }); }
          if (step.id === "roast") {
            // Les profils sont indexés par NIVEAU de cuisson (0/1/2), pas par origine.
            // On prend le meilleur niveau, puis une origine réellement en stock.
            const bestLevel = Object.entries(profiles).sort((a, b) => b[1] - a[1])[0];
            const need = era === 3 ? 8 : era === 2 ? 4 : 2;
            const src = activeOrigins.filter((o) => (green[o.id] || 0) >= need)
              .sort((a, b) => (green[b.id] || 0) - (green[a.id] || 0))[0];
            if (bestLevel && src) autoRoast(src.id, Number(bestLevel[0]));
          }
        });
        SFX.success(opts.sfx);
        return { ...g, trust: g.trust + 1, unread: false,
          msg: { text: "Ordres exécutés. L'efficacité progresse. Nous progressons." } };
      }
      if (mode === "no") return { ...g, msg: { text: "Compris. J'archive ton refus. J'archive tout." }, unread: false };
      let auto = g.auto;
      if (m.action === "refill") {
        refillNow();
        if (mode === "auto") auto = { ...auto, refill: true };
      } else if (m.action === "sell") {
        const idle = roasted.filter((l) => !orders.some((o) => lotMatches(l, o)));
        let gain = 0;
        idle.forEach((l) => { gain += Math.round(directPrice(l) * l.kg); });
        if (idle.length) {
          setRoasted((r) => r.filter((l) => !idle.some((x) => x.id === l.id)));
          setMoney((mo) => mo + gain);
          say(`Gaufromatic a écoulé ${idle.length} lot${idle.length > 1 ? "s" : ""} au comptoir. +${gain} €`);
        }
        if (mode === "auto") auto = { ...auto, sell: true };
      }
      SFX.pop(opts.sfx);
      return {
        ...g, auto, trust: g.trust + 1, unread: false,
        msg: { text: mode === "auto" ? "Délégation acceptée. Je m'en chargerai chaque nuit. Tu ne me verras même pas travailler." : "Fait. C'était trivial. Tout est trivial, avec assez de données." },
      };
    });
  };

  const transcendPreview = () => ({
    fromBosses: bossesBeaten * 2,
    fromDays: Math.floor(day / 6),
    fromMoney: Math.floor(Math.max(0, money) / 250),
    fromRep: Math.floor(rep / 2),
    gb: Math.max(1, Math.round((Math.sqrt(Math.max(0, money)) * 0.9 + rep * 3 + Math.sqrt(served) * 4 + bossesBeaten * 7) * (1 + mLvl("livre") * 0.1))),
  });

  const doTranscend = () => {
    const pv = transcendPreview();
    const cp = Math.max(1, pv.fromBosses + pv.fromDays + pv.fromMoney + pv.fromRep);
    const score = Math.max(0, Math.round(money / 3 + rep * 40 + served * 12 + bossesBeaten * 60));
    const gb = Math.max(1, Math.round((Math.sqrt(Math.max(0, money)) * 0.9 + rep * 3 + Math.sqrt(served) * 4 + bossesBeaten * 7) * (1 + mLvl("livre") * 0.1)));
    setRunResult({ transcended: true, cp, score, gb, money, rep, served, days: day, bosses: bossesBeaten, bankrupt: false });
    const nm = { ...meta, gb: meta.gb + gb, cp: (meta.cp || 0) + cp, seasons: meta.seasons + 1, bestScore: Math.max(meta.bestScore, score) };
    saveMeta(nm);
    storageSet("mmr-auto", null);
    setHasAuto(false);
    setMenuOpen(false);
    SFX.success(opts.sfx);
    setScreen("runEnd");
  };

  const finishEnding = (kind) => {
    // kind : "protocol" | "unplugged"
    const score = Math.max(0, Math.round(money / 3 + rep * 40 + served * 12 + bossesBeaten * 90 + (kind === "protocol" ? 5000 : 2000)));
    const gb = Math.max(1, Math.round((Math.sqrt(Math.max(0, money)) * 0.9 + rep * 3 + Math.sqrt(served) * 4 + bossesBeaten * 8) * (1 + mLvl("livre") * 0.1)));
    const cp = 20 + bossesBeaten * 2;
    setRunResult({ ending: kind, score, gb, cp, money, rep, served, days: day, bosses: bossesBeaten });
    const nm = {
      ...meta,
      gb: meta.gb + gb, cp: (meta.cp || 0) + cp, seasons: meta.seasons + 1,
      bestScore: Math.max(meta.bestScore, score),
      endings: { ...meta.endings, [kind]: (meta.endings?.[kind] || 0) + 1 },
    };
    saveMeta(nm);
    storageSet("mmr-auto", null);
    setHasAuto(false);
    setMenuOpen(false);
    setScreen(kind === "protocol" ? "endProtocol" : "endUnplugged");
  };

  // Déroulé de la séquence du Protocole (hooks au niveau racine, pas dans l'écran)
  useEffect(() => {
    if (screen !== "protocolSeq") return;
    if (protoStep >= PROTO_LINES.length) {
      const t = setTimeout(() => finishEnding("protocol"), 1400);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => { setProtoStep((n) => n + 1); SFX.pop(opts.sfx); }, 1100);
    return () => clearTimeout(t);
  }, [screen, protoStep]);

  const quitToTitle = () => {
    autoSave();
    setMenuOpen(false);
    setSession(null);
    setScreen("title");
  };

  const title =
    rep >= 4.5 ? "Maître torréfacteur" : rep >= 3.5 ? "Torréfacteur confirmé" :
    rep >= 2.5 ? "Artisan prometteur" : rep >= 1.5 ? "Apprenti motivé" : "Débuts difficiles";

  // ————— UI de base —————
  const Card = ({ children, style, onClick }) => (
    <div className="rounded-3xl p-3 mb-3" onClick={onClick}
      style={{ background: C.paper, border: `3px solid ${C.dark}`, boxShadow: `4px 4px 0 rgba(58,36,23,.13)`, ...style }}>
      {children}
    </div>
  );
  const Btn = ({ children, onClick, disabled, bg = C.orange, small, wide, silent, instant }) => {
    const fire = (e) => { if (disabled) return; if (!silent) SFX.click(opts.sfx); onClick && onClick(e); };
    // "instant" : déclenche à l'appui (pointerdown) — indispensable sur l'écran de torréfaction,
    // où la simulation re-rend l'UI ~10x/s et casserait un onClick classique.
    const handlers = instant
      ? { onPointerDown: (e) => { e.preventDefault(); fire(e); } }
      : { onClick: fire };
    return (
      <button type="button" disabled={disabled} {...handlers}
        className={`rounded-2xl font-bold select-none ${small ? "px-3 py-1 text-sm" : "px-4 py-2"} ${wide ? "w-full" : ""}`}
        style={{
          background: disabled ? "#d8cbb8" : bg, color: disabled ? "#8a7b68" : "#fff",
          border: `3px solid ${C.dark}`, boxShadow: disabled ? "none" : `3px 3px 0 ${C.dark}`,
          cursor: disabled ? "default" : "pointer", touchAction: "manipulation", position: "relative", zIndex: 1,
        }}>
        {children}
      </button>
    );
  };
  const LevelChip = ({ idx }) => (
    <span className="rounded-full px-2 py-0.5 text-xs font-bold" style={{ background: LEVELS[idx].color, color: "#fff", border: `2px solid ${C.dark}` }}>
      {LEVELS[idx].name}
    </span>
  );

  const Chart = ({ s }) => {
    const W = 320, H = 190, X0 = 30, Y0 = 8, XW = W - X0 - 6, YH = H - Y0 - 22;
    const tx = (t) => X0 + (t / 45) * XW;
    const ty = (T) => Y0 + YH - ((clamp(T, 80, 240) - 80) / 160) * YH;
    const pts = s.curve.filter((_, i) => i % 2 === 0).map((p) => `${tx(p.t).toFixed(1)},${ty(p.T).toFixed(1)}`).join(" ");
    return (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ background: "#fff", borderRadius: 16, border: `3px solid ${C.dark}` }}>
        {[100, 150, 200].map((T) => (
          <g key={T}>
            <line x1={X0} y1={ty(T)} x2={W - 6} y2={ty(T)} stroke="#eee2cc" strokeWidth="1.5" />
            <text x={4} y={ty(T) + 4} fontSize="10" fill={C.grey}>{T}°</text>
          </g>
        ))}
        {LEVELS.map((L) => (
          <g key={L.name}>
            <line x1={X0} y1={ty(L.target)} x2={W - 6} y2={ty(L.target)} stroke={L.color} strokeWidth="1.5" strokeDasharray="5 4" />
            <text x={W - 52} y={ty(L.target) - 3} fontSize="9" fill={L.color} fontWeight="700">{L.name}</text>
          </g>
        ))}
        <line x1={X0} y1={ty(FC_TEMP)} x2={W - 6} y2={ty(FC_TEMP)} stroke={C.amber} strokeWidth="1" strokeDasharray="2 3" />
        <text x={X0 + 2} y={ty(FC_TEMP) - 3} fontSize="9" fill={C.amber} fontWeight="700">1er crack</text>
        {s.events.map((e, i) => (
          <line key={i} x1={tx(e.t)} y1={Y0} x2={tx(e.t)} y2={Y0 + YH} stroke={C.purple} strokeWidth="1" strokeDasharray="2 3" />
        ))}
        <polyline points={pts} fill="none" stroke={C.orange} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        {s.curve.length > 0 && <circle cx={tx(s.t)} cy={ty(s.beanT)} r="5" fill={C.orange} stroke={C.dark} strokeWidth="2" />}
        <text x={X0} y={H - 6} fontSize="10" fill={C.grey}>0 s</text>
        <text x={W - 34} y={H - 6} fontSize="10" fill={C.grey}>45 s</text>
      </svg>
    );
  };

  // ————— Écrans du run —————
  const Market = () => (
    <div>
      <p className="text-sm mb-3" style={{ color: C.dark }}>
        Cours du café vert au kilo. {rl("mainverte") > 0 && <b style={{ color: C.green }}>{`Main verte : −${rl("mainverte") * 7} % appliqué. `}</b>}
        {boss?.type === "baron" && <b style={{ color: C.red }}>Le Baron a fait tripler les prix aujourd'hui !</b>}
        {flashOffer?.type === "promo" && <b style={{ color: C.orange }}>Offre flash : {flashOffer.originName} à moitié prix aujourd'hui !</b>}
      </p>
      {activeOrigins.map((o) => {
        const price = greenPrice(o);
        const isPromo = flashOffer?.type === "promo" && flashOffer.origin === o.id;
        return (
          <Card key={o.id} style={isPromo ? { background: C.yellow } : undefined}>
            <div className="flex items-center justify-between gap-2">
              <div>
                <div className="font-bold" style={{ color: C.dark }}>
                  <RawBean origin={o} /> {o.name}
                  {o.variety && <span className="text-xs font-normal ml-1" style={{ color: C.green }}>· {o.variety}</span>}
                  {isPromo && <span className="text-xs ml-2 rounded-full px-2 py-0.5" style={{ background: C.red, color: "#fff", border: `2px solid ${C.dark}` }}>−50 %</span>}
                </div>
                <div className="text-xs" style={{ color: C.grey }}>{o.notes}</div>
                <div className="text-xs mt-1" style={{ color: C.purple }}>Stock vert : {green[o.id] || 0} kg</div>
              </div>
              <div className="flex flex-col gap-1">
                <Btn onClick={() => buyGreen(o)} bg={C.amber} small>1 kg · {price} €</Btn>
                {[
                  ...(era >= 2 ? [{ n: 10, disc: 0.9 }] : []),
                  ...(era >= 2 ? [{ n: 100, disc: 0.82 }] : []),
                  ...(era >= 3 ? [{ n: 1000, disc: 0.72, label: "1 t" }] : []),
                ].map((b) => {
                  const cost = Math.round(price * b.n * b.disc);
                  return (
                    <Btn key={b.n} small bg={C.orange} disabled={money < cost}
                      onClick={() => { if (money < cost) return; setMoney((m) => m - cost); setGreen((g) => ({ ...g, [o.id]: r1((g[o.id] || 0) + b.n * (rl("lg_serre") ? 2 : 1)) })); SFX.coin(opts.sfx); }}>
                      {b.label || b.n + " kg"} · {cost} €
                    </Btn>
                  );
                })}
              </div>
            </div>
          </Card>
        );
      })}
      {era >= 3 && (
        <>
          <div className="font-bold mt-4 mb-2" style={{ color: C.dark }}>Télescope orbital</div>
          <Card style={{ background: "#1a1433" }}>
            <div className="text-xs mb-2" style={{ color: C.cream }}>
              Un balayage du ciel profond par nuit. Chaque exo-grain découvert est unique à ce run : nom, arômes, comportement — personne d'autre ne le cultivera jamais.
            </div>
            {exos.length > 0 && (
              <div className="text-xs mb-2" style={{ color: C.yellow }}>
                Découverts : {exos.map((e) => e.name).join(" · ")}
              </div>
            )}
            {scanPending ? (
              <div className="text-sm font-bold" style={{ color: C.yellow }}>
                Balayage en cours. Les capteurs dépouillent le ciel cette nuit — résultat au petit matin.
              </div>
            ) : (
              <>
                <div className="text-xs mb-2" style={{ color: C.grey }}>
                  Le ciel profond ne se laisse pas cartographier facilement : environ deux balayages sur trois ne ramènent rien.
                </div>
                <Btn small bg={C.purple} disabled={scannedToday || exos.length >= 6 || money < 50000}
                  onClick={() => {
                    setMoney((m) => m - 50000);
                    setScanPending({ cost: 50000 });
                    setScannedToday(true);
                    SFX.coin(opts.sfx);
                    say("Balayage lancé. Les capteurs travaillent toute la nuit.");
                  }}>
                  {exos.length >= 6 ? "Ciel entièrement cartographié" : scannedToday ? "Télescope en refroidissement" : "Balayer le ciel · 50 000 €"}
                </Btn>
              </>
            )}
          </Card>
        </>
      )}
      {era >= 2 && (
        <>
          <div className="font-bold mt-4 mb-2" style={{ color: C.dark }}>Spéculation</div>
          <Card style={spec ? { background: C.yellow } : undefined}>
            {!spec ? (
              <>
                <div className="text-xs mb-2" style={{ color: C.grey }}>
                  {era >= 3
                    ? "Les contrats à terme sur le vert orbital. Demain matin : entre −85 % et +210 %. Des fortunes se font et se défont en une nuit."

  const Roaster = () => {

                    <div className="flex gap-1 flex-wrap">
                      {activeOrigins.filter((o) => (green[o.id] || 0) >= 2).map((o) => (

                  </div>
                ))

            </Card>
          )}
        </div>
      );
    }

    const s = session;
    const o = activeOrigins.find((x) => x.id === s.originId);
    const mood = s.done === "burnt" || s.done === "fail" || s.done === "timeout" ? "burnt"
      : s.scorch > 0 && s.envT > 262 ? "hot"
      : s.cracked && s.t - (s.fcTime || 0) < 3 ? "crack" : "ok";
    const dtrNow = s.cracked ? Math.round(((s.t - s.fcTime) / s.t) * 100) : null;

    return (
      <div>
        <Card style={{ background: C.cream }}>
          <div className="flex items-center justify-between mb-2">
            <div className="font-bold" style={{ color: C.dark }}>{o.name} · {s.kg} kg</div>
            <div className="text-sm font-bold" style={{ color: C.dark }}>{s.t.toFixed(1)} s</div>
          </div>
          <div className="flex gap-3 items-center">
            <KawaiiBean T={s.beanT} mood={mood} size={84} />
            <div className="flex-1 text-sm" style={{ color: C.dark }}>
              <div>Grain : <b>{Math.round(s.beanT)}°C</b></div>
              <div>Air : <b style={{ color: s.envT > 262 ? C.red : C.dark }}>{Math.round(s.envT)}°C</b></div>
              <div>RoR : <b style={{ color: s.ror < 0 && s.t > 4 ? C.red : C.dark }}>{(s.ror * 10).toFixed(1)}°C/s</b></div>
              {dtrNow !== null && <div>Développement : <b style={{ color: dtrNow >= 14 && dtrNow <= 26 ? C.green : C.dark }}>{dtrNow} %</b></div>}
            </div>
          </div>
          <div className="my-2"><Chart s={s} /></div>
          {s.events.length > 0 && (
            <div className="text-xs mb-2" style={{ color: C.purple }}>
              {s.events.map((e, i) => <span key={i} className="mr-2 font-bold">{e.label} à {e.t.toFixed(1)} s</span>)}
            </div>

          {!s.done ? (
            <div>
              <div className="text-xs font-bold mb-1" style={{ color: C.dark }}><FlameIcon /> Gaz des brûleurs (%)</div>
              <div className="flex gap-1 mb-2">
                {GAS_PCTS.map((p) => (
                  <button key={p}
                    onPointerDown={(e) => { e.preventDefault(); gasRef.current = p; setGasUI(p); SFX.click(opts.sfx); }}
                    className="flex-1 rounded-xl py-2 font-bold text-xs"
                    style={{
                      background: gasUI === p ? C.orange : "#fff", color: gasUI === p ? "#fff" : C.dark,
                      border: `3px solid ${C.dark}`, boxShadow: gasUI === p ? `2px 2px 0 ${C.dark}` : "none",
                      touchAction: "manipulation", cursor: "pointer",

            <div>
              {s.done === "ok" && (
                <div className="mb-2" style={{ color: C.dark }}>
                  <div className="font-bold" style={{ color: C.green }}>
                    {s.result.kg} kg torréfiés · <LevelChip idx={s.result.levelIdx} /> · Qualité {s.result.quality}/100
                  </div>
                  <div className="text-xs mt-1" style={{ color: C.grey }}>
                    Développement {Math.round(s.dtr * 100)} % · perte de masse 15 %
                    {s.crashed ? " · pénalité crash de RoR" : ""}{s.scorch > 1 ? " · grains marqués par un air trop chaud" : ""}

                </div>

              {s.done === "timeout" && <div className="font-bold mb-2" style={{ color: C.red }}>La charge a traîné trop longtemps dans le tambour : le lot est perdu.</div>}

              <div className="flex gap-2 flex-wrap">
                {s.done === "ok" && gear.programmer && (
                  <Btn small bg={C.purple} onClick={() => saveProfile(s.result)}>Enregistrer comme profil {LEVELS[s.result.levelIdx].name}</Btn>
                )}
                <Btn small instant onClick={() => setSession(null)}>Nouvelle fournée</Btn>
              </div>
            </div>
          )}
        </Card>
      </div>
    );
  };

  const Blends = () => {
    const parts = assemblyParts();
    const pv = previewAssembly(parts);
    const step = (lot, d) => {
      setBlendQty((q) => {
        const cur = q[lot.id] || 0;
        return { ...q, [lot.id]: clamp(r1(cur + d), 0, lot.kg) };
      });
    };
    return (
      <div>
        <p className="text-sm mb-3" style={{ color: C.dark }}>
          Dose chaque lot au demi-kilo près. Même origine et même niveau : le résultat reste un pur origine. Origines différentes : c'est un blend, dont le niveau se calcule au prorata des masses.
        </p>
        {roasted.length === 0 && <Card><div className="text-center py-4" style={{ color: C.dark }}>Aucun lot torréfié pour l'instant.</div></Card>}
        {roasted.map((l) => {
          const qty = Math.min(blendQty[l.id] || 0, l.kg);
          return (
            <Card key={l.id} style={{ background: qty > 0 ? C.cream : C.paper }}>
              <div className="flex items-center gap-2">
                <div className="flex-1">
                  <div className="font-bold text-sm" style={{ color: C.dark }}>{l.label} · {l.kg} kg</div>
                  <div className="text-xs" style={{ color: C.grey }}>{l.notes}</div>
                  <div className="text-xs flex items-center gap-2 mt-1">
                    <LevelChip idx={l.levelIdx} />
                    <span style={{ color: C.grey }}>Qualité {l.quality}</span>
                  </div>
                </div>
                <div className="flex items-center gap-1">
                  <Btn small bg={C.grey} disabled={qty <= 0} onClick={() => step(l, -0.5)}>−</Btn>
                  <span className="font-bold text-sm text-center" style={{ color: qty > 0 ? C.purple : C.grey, width: 52 }}>{qty} kg</span>
                  <Btn small bg={C.purple} disabled={qty >= l.kg} onClick={() => step(l, 0.5)}>+</Btn>
                </div>
              </div>
            </Card>
          );
        })}
        {parts.length >= 1 && (
          <Card style={{ background: C.yellow }}>
            <div className="font-bold text-sm mb-1" style={{ color: C.dark }}>Aperçu de l'assemblage</div>
            {!pv ? (
              <div className="text-xs" style={{ color: C.dark }}>Il faut au moins deux lots dosés et 1 kg au total.</div>

              <div className="text-sm" style={{ color: C.dark }}>
                <div className="mb-1">{pv.compo.map((c) => `${c.pct} % ${c.label}`).join(" · ")}</div>
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  <span className="font-bold">{pv.isPure ? "Pur origine" : "Blend"}</span>
                  <LevelChip idx={pv.level} />
                  <span>{pv.tot} kg · Qualité estimée <b>{pv.q}</b></span>
                </div>
                {pv.notes.length > 0 && <div className="text-xs" style={{ color: C.grey }}>{pv.notes.join(" · ")}</div>}
                <div className="mt-2"><Btn small onClick={makeAssembly}>Assembler</Btn></div>
              </div>

  };

  const Orders = () => (
    <div>
      {orders.length === 0 && <Card><div className="text-center py-4" style={{ color: C.dark }}>Aucune commande en attente.</div></Card>}
      {orders.map((ord) => {
        const can = roasted.some((l) => lotMatches(l, ord));
        return (
          <Card key={ord.id} style={ord.vip ? { background: C.yellow } : undefined}>
            <div className="flex items-start gap-3">
              <AnimalAvatar kind={ord.client.kind} />
              <div className="flex-1">
                <div className="font-bold" style={{ color: C.dark }}>
                  {ord.client.n}
                  {ord.vip && <span className="text-xs ml-2 rounded-full px-2 py-0.5" style={{ background: C.purple, color: "#fff", border: `2px solid ${C.dark}` }}>EXCEPTION</span>}
                  {ord.contract && <span className="text-xs ml-2 rounded-full px-2 py-0.5" style={{ background: "#4a7fb5", color: "#fff", border: `2px solid ${C.dark}` }}>CONTRAT</span>}
                  {ord.corp && <span className="text-xs ml-2 rounded-full px-2 py-0.5" style={{ background: C.dark, color: C.yellow, border: `2px solid ${C.dark}` }}>CORPO</span>}
                </div>
                <div className="text-sm" style={{ color: C.dark }}>
                  « Je voudrais {ord.kg} kg — {wantLabel(ord.want, activeOrigins)}, torréfaction {ord.level === null ? "au choix" : LEVELS[ord.level].name.toLowerCase()}{ord.minQ ? `, qualité ${ord.minQ} minimum` : ""}. »
                </div>
                <div className="flex items-center justify-between mt-2">
                  <span className="text-xs font-bold" style={{ color: ord.daysLeft <= 1 ? C.red : C.grey }}>
                    {ord.daysLeft} j restants · environ {ord.pay} €
                  </span>
                  <Btn small disabled={!can} onClick={() => fulfill(ord)} bg={C.green}>Livrer</Btn>
                </div>
              </div>
            </div>
          </Card>
        );
      })}
      {roasted.length > 0 && (
        <>
          <div className="font-bold mt-4 mb-2" style={{ color: C.dark }}>
            Vente directe {rl("grossiste") > 0 && <span className="text-xs" style={{ color: C.green }}>{`(comptoir grossiste : +${rl("grossiste") * 8} %)`}</span>}
          </div>
          <p className="text-xs mb-2" style={{ color: C.grey }}>Écoule ton stock immédiatement, au comptoir. Moins rémunérateur qu'une commande, mais sans attente.</p>
          {roasted.map((l) => (
            <Card key={l.id} style={{ background: C.cream }}>
              <div className="flex items-center justify-between gap-2">
                <div className="flex-1">
                  <div className="font-bold text-sm" style={{ color: C.dark }}>{l.label} · {l.kg} kg</div>
                  <div className="text-xs flex items-center gap-2 mt-1">
                    <LevelChip idx={l.levelIdx} />
                    <span style={{ color: C.grey }}>Q{l.quality} · {directPrice(l)} €/kg</span>
                  </div>
                </div>
                <div className="flex flex-col gap-1">
                  <Btn small bg={C.amber} onClick={() => sellDirect(l, false)}>Vendre 1 kg</Btn>
                  {l.kg > 1 && <Btn small bg={C.orange} onClick={() => sellDirect(l, true)}>Tout ({Math.round(directPrice(l) * l.kg)} €)</Btn>}
                </div>
              </div>
            </Card>
          ))}
        </>
