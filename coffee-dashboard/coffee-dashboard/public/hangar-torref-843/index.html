<script>
// Shim : reproduit l'API window.storage des artifacts Claude avec localStorage
window.storage = {
  async get(key) {
    const v = localStorage.getItem("mmr:" + key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem("mmr:" + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem("mmr:" + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith("mmr:" + (prefix || ""))) keys.push(k.slice(4));
    }
    return { keys };
  },
};
</script>

// Connexions : parcours en largeur sur les cases occupées adjacentes (orthogonales)
function computeFlow(grid) {
  const keys = Object.keys(grid);
  const neigh = (k) => {
    const [r, c] = k.split(",").map(Number);
    return [`${r - 1},${c}`, `${r + 1},${c}`, `${r},${c - 1}`, `${r},${c + 1}`].filter((n) => grid[n]);
  };
  const reach = (fromTypes) => {
    const seen = new Set(keys.filter((k) => fromTypes.includes(grid[k].type)));
    const queue = [...seen];
    while (queue.length) {
      const k = queue.shift();
      for (const n of neigh(k)) if (!seen.has(n)) { seen.add(n); queue.push(n); }
    }
    return seen;
  };
  const isRoaster = (t) => MACHINES[t] && MACHINES[t].roast > 0;
  const fromSilo = reach(["silo"]);
  const fedRoasters = new Set(keys.filter((k) => isRoaster(grid[k].type) && fromSilo.has(k)));
  const fromFed = fedRoasters.size
    ? (() => {
        const seen = new Set(fedRoasters);
        const queue = [...seen];
        while (queue.length) {
          const k = queue.shift();
          for (const n of neigh(k)) if (!seen.has(n)) { seen.add(n); queue.push(n); }
        }
        return seen;
      })()
    : new Set();
  const isBagger = (t) => MACHINES[t] && MACHINES[t].bag > 0;
  const fedBaggers = new Set(keys.filter((k) => isBagger(grid[k].type) && fromFed.has(k)));
  const fedMixers = new Set(keys.filter((k) => grid[k].type === "mixer" && fromFed.has(k)));
  // capacité d'entrée totale = somme des débits des torréfacteurs alimentés
  let roastCap = 0, bagCap = 0;
  fedRoasters.forEach((k) => { roastCap += MACHINES[grid[k].type].roast; });
  fedBaggers.forEach((k) => { bagCap += MACHINES[grid[k].type].bag; });
  return { fromSilo, fedRoasters, roastCap, fedBaggers, bagCap, fedMixers };
}

// Prix payé selon la qualité : jusqu'à 100 c'est linéaire, au-delà la rareté s'envole.
// Un lot à 150 vaut ~2,4× un lot à 100 ; un lot à 220 vaut ~5×. Le café d'étoile devient une rente.
const qPayMult = (q) => {
  const base = 0.55 + (Math.min(q, 100) / 100) * 0.5;           // 0,55 → 1,05
  const extra = Math.max(0, q - 100);
  return base + Math.pow(extra / 100, 1.35) * 3.6;
};

}
async function storageSet(key, obj) {

}

function beanColor(T) {
  const stops = [
    [95, [124, 165, 80]], [150, [206, 190, 120]], [170, [190, 140, 85]],
    [196, [138, 90, 53]], [212, [90, 56, 32]], [226, [50, 32, 20]], [240, [20, 13, 8]],
  ];
  if (T < stops[0][0]) return `rgb(${stops[0][1].join(",")})`;
  if (T > stops[stops.length - 1][0]) return `rgb(${stops[stops.length - 1][1].join(",")})`;
  let a = stops[0], b = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++)
    if (T >= stops[i][0] && T <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
  const t = (T - a[0]) / (b[0] - a[0] || 1);
  const c = a[1].map((v, i) => Math.round(v + (b[1][i] - v) * t));
  return `rgb(${c.join(",")})`;
}

function wantLabel(want, origins) {
  if (want === "blend") return "un blend maison";

}

// ————— Kit de sons (WebAudio) : des "plops" ronds et feutrés, pas de bips —————
let audioCtx = null;
function ctx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
// Sinus avec glissando + filtre passe-bas : son de bulle, doux pour l'oreille
function plop(f0, f1, dur, vol, delay = 0, gainMax = 0.05) {
  if (vol <= 0) return;
  try {
    const ac = ctx();
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain(), flt = ac.createBiquadFilter();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    flt.type = "lowpass"; flt.frequency.value = 1400; flt.Q.value = 0.4;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gainMax * (vol / 100), t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(flt); flt.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch { /* silencieux */ }
}
// Petit claquement organique (bruit filtré) pour le crack des grains
function crackle(vol) {
  if (vol <= 0) return;
  try {
    const ac = ctx();
    const t0 = ac.currentTime;
    const len = Math.floor(ac.sampleRate * 0.05);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = ac.createBufferSource(); src.buffer = buf;
    const flt = ac.createBiquadFilter(); flt.type = "bandpass"; flt.frequency.value = 2100; flt.Q.value = 0.9;
    const g = ac.createGain(); g.gain.value = 0.06 * (vol / 100);
    src.connect(flt); flt.connect(g); g.connect(ac.destination);
    src.start(t0);
  } catch { /* silencieux */ }
}

  click: (v) => plop(660, 400, 0.09, v, 0, 0.035),

  success: (v) => { plop(500, 540, 0.12, v, 0, 0.05); plop(640, 690, 0.12, v, 0.1, 0.05); plop(770, 830, 0.2, v, 0.2, 0.05); },
  error: (v) => plop(210, 120, 0.22, v, 0, 0.05),
  crack: (v) => crackle(v),
  pop: (v) => plop(480, 850, 0.09, v, 0, 0.04),
  drop: (v) => { plop(620, 380, 0.12, v, 0, 0.05); plop(760, 480, 0.16, v, 0.09, 0.05); },
};
const beep = (f, d, v) => plop(f, f * 0.7, d, v, 0, 0.04);

  },
};

// Éclaircit (amt>0) ou assombrit (amt<0) une couleur hexadécimale
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt > 0 ? 255 : 0, p = Math.abs(amt);
  r = Math.round((t - r) * p) + r;
  g = Math.round((t - g) * p) + g;
  b = Math.round((t - b) * p) + b;
  return "#" + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function BossIris({
  src, name, sub, ringA, ringB, hub,
  hole = 22, w = 70, ink = 0, g = 0.5, over = 65, dur = 1200,
  nameSize = 78, subSize = 64, nameTrack = 10, subTrack = 6,
  charW = 62, charBottom = 0, breatheAmp = 1.0, breatheDur = 800,
  pop = 0, popDelay = 0,
  blend = "normal", reduced = false,
}) {
  // Nom d'animation unique par boss : chacun a son propre saut d'entrée
  const popName = React.useMemo(() => "pop" + Math.random().toString(36).slice(2, 8), []);
  const [reveal, setReveal] = React.useState(reduced ? 75 : 0);
  const [imgReady, setImgReady] = React.useState(false);
  const CX = 500, CY = 480, RMAX = 470, RVL = 75;

  // On n'ouvre l'iris qu'une fois le visuel chargé (le GIF du Baron est lourd)
  React.useEffect(() => {
    let alive = true;
    const im = new Image();
    im.onload = () => { if (alive) setImgReady(true); };
    im.onerror = () => { if (alive) setImgReady(true); }; // on ouvre quand même si l'image manque
    im.src = src;
    if (im.complete) setImgReady(true);
    return () => { alive = false; };
  }, [src]);

  React.useEffect(() => {
    if (!imgReady) return;
    if (reduced) { setReveal(RVL); return; }
    const t0 = performance.now();
    let id;
    const step = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      setReveal(RVL * (1 - Math.pow(1 - p, 3))); // easeOutCubic
      if (p < 1) id = requestAnimationFrame(step);
    };
    id = requestAnimationFrame(step);
    return () => cancelAnimationFrame(id);
  }, [imgReady]);

  // Anneaux empilés du plus grand au plus petit, chacun avec son dégradé
  const holeR = hole * 10;
  const rings = [];
  for (let r = RMAX, i = 0; r > holeR + 1; i++) {
    const inner = Math.max(r - w, holeR);
    const base = i % 2 ? ringB : ringA;
    rings.push({ id: "rg" + i, r, off: inner / r, hi: shade(base, g * 0.55), lo: shade(base, -g * 0.65) });
    r = inner;
  }

  const slotStyle = { paddingBottom: charBottom + "%" };
  const artStyle = {
    width: charW + "%", transformOrigin: "50% 100%", mixBlendMode: blend,
    animation: reduced
      ? "none"
      : (pop > 0
          ? `bossBreathe ${breatheDur}ms ease-in-out infinite, ${popName} .6s cubic-bezier(.34,1.56,.64,1) ${Math.round((popDelay / 100) * dur)}ms backwards`
          : `bossBreathe ${breatheDur}ms ease-in-out infinite`),
    "--breathe-amp": breatheAmp / 100,
  };
  // Keyframes du saut, calculées depuis l'amplitude (mêmes formules que l'atelier)
  const popCSS = pop > 0 ? `
    @keyframes ${popName} {
      0%   { transform: scaleX(${(1 - 0.5 * pop).toFixed(3)}) scaleY(${(1 - 0.58 * pop).toFixed(3)}) translateY(${(18 * pop).toFixed(1)}%); }
      45%  { transform: scaleX(${(1 + 0.1 * pop).toFixed(3)}) scaleY(${(1 + 0.06 * pop).toFixed(3)}); }
      70%  { transform: scaleX(${(1 - 0.03 * pop).toFixed(3)}) scaleY(${(1 + 0.02 * pop).toFixed(3)}); }
      100% { transform: scale(1); }
    }` : "";
  const art = <img src={src} alt="" className="boss-art" style={artStyle} />;

  const nameDx = -nameTrack / 2, subDx = -subTrack / 2;
  const nameStyle = { fontSize: nameSize, strokeWidth: (nameSize * 0.16).toFixed(1), letterSpacing: nameTrack };
  const subStyle = { fontSize: subSize, strokeWidth: (subSize * 0.22).toFixed(1), letterSpacing: subTrack };

  return (
    <div className="relative w-full" style={{ aspectRatio: "1 / 1" }}>
      <style>{`
        @keyframes bossBreathe {
          0%, 100% { transform: scaleY(calc(1 - var(--breathe-amp, 0.01))) scaleX(calc(1 + var(--breathe-amp, 0.01) * 0.6)); }
          50%      { transform: scaleY(calc(1 + var(--breathe-amp, 0.01))) scaleX(calc(1 - var(--breathe-amp, 0.01) * 0.6)); }
        }
        @keyframes irisSpin { to { transform: rotate(360deg); } }
        .boss-slot { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
      `}</style>
      {popCSS && <style>{popCSS}</style>}
      {!imgReady && (
        <div className="absolute inset-0 flex flex-col items-center justify-center" style={{ zIndex: 5 }}>
          <div style={{
            width: 46, height: 46, borderRadius: "50%",
            border: "5px solid rgba(255,255,255,.25)", borderTopColor: "#F5E9C8",
            animation: "irisSpin .8s linear infinite",
          }} />
          <div className="text-xs mt-3" style={{ color: "#F5E9C8", opacity: .8 }}>Il approche…</div>
        </div>
      )}
      <div className="absolute inset-0" style={{ clipPath: `circle(${reveal}% at 50% 48%)` }}>
        <svg viewBox="0 0 1000 1000" className="absolute inset-0">
          <defs>
            {rings.map((q) => (
              <radialGradient key={q.id} id={q.id}>
                <stop offset={q.off} stopColor={q.hi} />
                <stop offset="1" stopColor={q.lo} />
              </radialGradient>
            ))}
          </defs>
          {rings.map((q) => (
            <circle key={q.id} cx={CX} cy={CY} r={q.r} fill={`url(#${q.id})`} stroke="#241C17" strokeWidth={ink} />
          ))}
          <circle cx={CX} cy={CY} r={holeR} fill={hub} stroke="#241C17" strokeWidth={ink} />
        </svg>
        {/* Le boss, dans le trou */}
        <div className="absolute inset-0" style={{ clipPath: `circle(${hole}% at 50% 48%)` }}>
          <div className="boss-slot" style={slotStyle}>{art}</div>
        </div>
        {/* Le haut du boss, par-dessus les anneaux */}
        <div className="absolute inset-0" style={{ clipPath: `inset(0 0 ${100 - over}% 0)` }}>
          <div className="boss-slot" style={slotStyle}>{art}</div>
        </div>
        <svg viewBox="0 0 1000 1000" className="absolute inset-0" style={{ pointerEvents: "none" }}>
          <defs>
            <path id="arcTop" d="M 140,480 A 360,360 0 0 1 860,480" fill="none" />
            <path id="arcBot" d="M 105,480 A 395,395 0 0 0 895,480" fill="none" />
          </defs>
          <g transform="translate(7,9)" opacity="0.85">
            <text className="iris-name iris-shadow" textAnchor="middle" dx={nameDx} style={nameStyle}>
              <textPath href="#arcTop" startOffset="50%">{name}</textPath></text>
            <text className="iris-sub iris-shadow" textAnchor="middle" dx={subDx} style={subStyle}>
              <textPath href="#arcBot" startOffset="50%">{sub}</textPath></text>
          </g>
          <text className="iris-name" textAnchor="middle" dx={nameDx} style={nameStyle}>
            <textPath href="#arcTop" startOffset="50%">{name}</textPath></text>
          <text className="iris-sub" textAnchor="middle" dx={subDx} style={subStyle}>
            <textPath href="#arcBot" startOffset="50%">{sub}</textPath></text>
        </svg>
      </div>
    </div>
  );
}

    const rr = Array.isArray(s.relics) ? Object.fromEntries(s.relics.map((id) => [id, 1])) : (s.relics || {});

    setGaufro(s.gaufro || null); setGaufroOpen(false); setEra(s.era || 1); setSpec(s.spec || null);
    setExos(s.exos || []); setScannedToday(!!s.scannedToday); setScanPending(s.scanPending || null); setDecafSummoned(!!s.decafSummoned); setStarsUnlocked(s.starsUnlocked || ["naine"]);
    setDraftChoices(s.draftChoices || []); setPendingEra(s.pendingEra || null);

    resumeScreen.current = ["draft", "victory", "eraUp", "eraUp3", "bossIntro"].includes(s.screen) ? s.screen : "game"; setStellar(s.stellar || null); setVacuumMode(false); setEndgame(s.endgame || null); setDysonStage(s.dysonStage || 0); setDelegated(s.delegated || []);
    lotId.current = s.lotN; oid.current = s.oidN;

  };
  const autoSave = (snap) => { storageSet("mmr-auto", snap || snapshot()); setHasAuto(true); };

  useEffect(() => {

  // ————— Génération —————

  };

  const makeOrder = (d, forcePatience, originsOverride) => {

    const pool = originsOverride || activeOrigins;
    const roll = Math.random();
    const want = roll < 0.55 ? pick(pool).id : roll < 0.85 ? null : "blend";
    const level = Math.floor(Math.random() * 3);
    const kg = d <= 4 ? pick([1, 1, 2, 2, 3]) : pick([2, 2, 3, 3, 4]);

    return {

      if (pausedRef.current) return; // partie en pause : la torréfaction attend sagement
      setSession((s) => {
        if (!s || s.done) return s;
        const dt = 0.1 * (opts.fastSim ? 1.5 : 1);
        const t = s.t + dt;
        let { beanT, envT, scorch, crashed } = s;
        const events = [...s.events];

        } else if (s.vacuum) {

          const target = 140 + gasRef.current * 1.5; // jusqu'à 290 °C
          const inertia = 0.05 + rl("ceramique") * 0.006;
          envT += (target - envT) * inertia * (opts.fastSim ? 1.5 : 1);
          beanT += (envT - beanT) * 0.0040 * (opts.fastSim ? 1.5 : 1);
        } else {
          const target = gasTarget(gasRef.current);
          const inertia = 0.045 + rl("ceramique") * 0.006;
          envT += (target - envT) * inertia * (opts.fastSim ? 1.5 : 1);
          beanT += (envT - beanT) * 0.0048 * (opts.fastSim ? 1.5 : 1);
          if (envT > 262 && beanT < 155) scorch += 0.35;
        }
        const prev = s.curve[s.curve.length - 1];
        const ror = prev ? (beanT - prev.T) / dt : 0;
        if (t > 4 && ror < -0.05 && !crashed) { crashed = true; events.push({ t, label: "Crash de RoR" }); }
        let cracked = s.cracked, fcTime = s.fcTime, secondCrack = s.secondCrack;
        if (!cracked && beanT >= FC_TEMP && t > 3) {
