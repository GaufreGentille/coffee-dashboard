  const Conveyor = () => (
    <div className="relative overflow-hidden rounded-xl" style={{ height: 26, background: C.dark }}>
      {!opts.reducedAnim && <style>{`@keyframes belt { from { transform: translateX(0); } to { transform: translateX(-40px); } }`}</style>}
      <div className="absolute inset-0 flex items-center" style={{ animation: opts.reducedAnim ? "none" : "belt 1s linear infinite", width: "200%" }}>
        {Array.from({ length: 24 }).map((_, i) => (
          <div key={i} style={{ width: 14, height: 14, marginLeft: 26, borderRadius: "50%", background: "#83552f", border: "2px solid #fff3", flexShrink: 0 }} />
        ))}
      </div>
    </div>
  );

  // ————— Anneau stellaire : son propre onglet, une fois le module construit —————
  const Stellar = () => (
    <div className="space-y-3">
          <Card style={{ background: "#1a1433" }}>
            <div className="font-bold text-sm mb-1" style={{ color: C.yellow }}>Torréfaction stellaire</div>
            {!stellar ? (
              <>
                <div className="text-xs mb-2" style={{ color: C.cream }}>
                  Place un anneau de cargos en orbite d'une étoile : elle devient ton brûleur. C'est la <b>seule technologie capable de dépasser le plafond de qualité terrestre</b> — aucune main, aucune machine ne monte aussi haut. Construction : 12 000 €.
                </div>
                <Btn small bg={C.purple} disabled={money < 12000}
                  onClick={() => { setMoney((m) => m - 12000); setStellar({ star: 1, starClass: 0, orbit: "ideale" }); SFX.success(opts.sfx); }}>
                  Construire l'anneau · 12 000 €
                </Btn>
              </>
            ) : (
              <>
                <div className="text-xs mb-1" style={{ color: C.cream }}>Classe de l'étoile-brûleur :</div>
                <div className="flex gap-1 mb-1 flex-wrap">
                  {STARS.map((st, i) => {
                    const owned = starsUnlocked.includes(st.id);
                    const active = (stellar.starClass ?? 0) === i;
                    const afford = money >= st.cost;
                    return (
                      <button key={st.id} type="button"
                        onClick={() => {
                          if (owned) { SFX.click(opts.sfx); setStellar((v) => ({ ...v, starClass: i })); return; }
                          if (!afford) { SFX.error(opts.sfx); say(`Calibrer sur ${st.name} demande ${st.cost.toLocaleString("fr-FR")} €.`); return; }
                          setMoney((m) => m - st.cost);
                          setStarsUnlocked((u) => [...u, st.id]);
                          setStellar((v) => ({ ...v, starClass: i }));
                          SFX.success(opts.sfx);
                          say(`Anneau recalibré sur ${st.name}. Les cargos se réalignent dans un silence total.`);
                        }}
                        className="rounded-xl py-1 px-2 text-xs font-bold"
                        style={{ flex: "1 1 44%",
                          background: active ? st.col : owned ? "#2a2347" : "#1c1830",
                          color: active ? (st.id === "jaune" ? C.dark : "#fff") : owned ? C.cream : (afford ? C.yellow : C.grey),
                          border: `2px solid ${owned ? C.dark : "rgba(255,255,255,.18)"}`,
                          cursor: "pointer", opacity: owned || afford ? 1 : 0.6 }}>
                        {owned ? st.name : `${st.name} · ${Math.round(st.cost / 1000)}k €`}
                      </button>
                    );
                  })}
                </div>
                {(() => {
                  const st = STARS[stellar.starClass ?? 0] || STARS[0];
                  const ceil = qCeil(meta.cpUnlocks) + st.over + (rl("lg_gyroscope") ? 10 : 0);
                  return (
                    <div className="text-xs mb-2 rounded-xl px-2 py-1" style={{ background: "#241d3f", color: C.cream }}>
                      <div className="italic mb-1">{st.desc}</div>
                      <div style={{ color: C.yellow }}>
                        Qualité jusqu'à <b>{ceil}</b> (plafond terrestre : {qCeil(meta.cpUnlocks)}) · {st.cap} kg/nuit · risque d'éruption {Math.round(st.risk * 100)} %
                      </div>
                    </div>
                  );
                })()}
                <div className="text-xs mb-1" style={{ color: C.cream }}>Niveau de cuisson :</div>
                <div className="flex gap-1 mb-2">
                  {LEVELS.map((lv, li) => (
                    <button key={li} type="button" onClick={() => { SFX.click(opts.sfx); setStellar((v) => ({ ...v, star: li })); }}
                      className="flex-1 rounded-xl py-1 text-xs font-bold"
                      style={{ background: stellar.star === li ? C.orange : "#2a2347", color: "#fff", border: `2px solid ${C.dark}`, cursor: "pointer" }}>
                      {lv.name}
                    </button>
                  ))}
                </div>
                {/* ————— L'appel du Décaféinateur ————— */}
                {bossesBeaten >= 4 && !decafSummoned && (
                  <div className="rounded-2xl px-3 py-2 mb-3" style={{ background: "#1a0f14", border: `2px solid ${C.red}` }}>
                    <div className="text-xs font-bold mb-1" style={{ color: C.red }}>L'ANNEAU CAPTE QUELQUE CHOSE</div>
                    <div className="text-xs mb-2" style={{ color: C.cream }}>
                      Une absence se déplace entre les étoiles. Elle ne vient pas d'elle-même : il faut l'appeler.
                      Brûle un café d'exception dans l'anneau — un lot stellaire — et le vide saura que tu existes.
                      {day < 69 && <span style={{ color: C.grey }}> (Il est trop tôt. L'anneau n'est pas assez chargé — reviens vers le jour 70.)</span>}
                    </div>
                    <Btn small bg={C.red}
                      disabled={day < 69 || !roasted.some((l) => l.stellar && l.kg >= 5)}
                      onClick={() => {
                        const offering = roasted.filter((l) => l.stellar && l.kg >= 5).sort((a, b) => b.quality - a.quality)[0];
                        if (!offering) return;
                        setRoasted((r) => r.map((l) => (l.id === offering.id ? { ...l, kg: r1(l.kg - 5) } : l)).filter((l) => l.kg > 0.05));
                        setDecafSummoned(true);
                        SFX.error(opts.sfx);
                        say(`Tu jettes 5 kg de ${offering.label} (Q${offering.quality}) dans l'anneau. Le café se volatilise sans fumée. Quelque part, très loin, quelque chose vient d'ouvrir les yeux.`);

                      {!roasted.some((l) => l.stellar && l.kg >= 5) ? "Il faut 5 kg d'un lot stellaire" : "Offrir 5 kg au vide"}
                    </Btn>
                  </div>
                )}
                {decafSummoned && (
                  <div className="rounded-2xl px-3 py-2 mb-3 text-xs" style={{ background: "#1a0f14", border: `2px solid ${C.red}`, color: C.cream }}>
                    <b style={{ color: C.red }}>IL A ENTENDU.</b> Il approche. Prépare la plus grande, la plus parfaite cuisson que ton empire sache produire.
                  </div>
                )}
                <div className="text-xs mb-1" style={{ color: C.cream }}>Orbite :</div>
                <div className="flex gap-1">
                  {["proche", "ideale", "lointaine"].map((ob) => (
                    <button key={ob} type="button" onClick={() => { SFX.click(opts.sfx); setStellar((v) => ({ ...v, orbit: ob })); }}
                      className="flex-1 rounded-xl py-1 text-xs font-bold"
                      style={{ background: stellar.orbit === ob ? C.purple : "#2a2347", color: "#fff", border: `2px solid ${C.dark}`, cursor: "pointer" }}>
                      {ob === "ideale" ? "idéale" : ob === "proche" ? "proche (+risque)" : "lointaine (−risque)"}

  const Factory = () => {
    if (!gear.programmer) {
      return (
        <Card>
          <div className="font-bold mb-1" style={{ color: C.dark }}>Usine verrouillée</div>
          <div className="text-sm" style={{ color: C.grey }}>
            Installe d'abord le programmateur de courbes (au marché, rayon équipement), puis enregistre au moins un profil de torréfaction. L'usine tournera toute seule avec tes profils.
          </div>
        </Card>
      );
    }
    const flow = computeFlow(factoryGrid);
    const hasProfile = Object.keys(profiles).length > 0;
    const bestQ = hasProfile ? Math.max(...Object.values(profiles)) : null;
    const nR = flow.fedRoasters.size, nB = flow.fedBaggers.size;
    const capIn = flow.roastCap;
    const capOut = flow.bagCap + nB * rl("turbo");

    // ——— Planche d'usine en SVG ———
    const S = 48;
    const W = COLS * S, H = ROWS * S;
    const cx = (c) => c * S + S / 2;
    const cy = (r) => r * S + S / 2;
    const keys = Object.keys(factoryGrid);
    const isMachine = (k) => factoryGrid[k] && factoryGrid[k].type !== "belt";
    const dropCell = drag?.moved ? cellAtPoint(drag.x, drag.y) : null;
    const dropOk = dropCell && !factoryGrid[dropCell] && (drag.fromKey || money >= (MACHINES[drag.type]?.cost || 0));

    const platformFill = (k) => (flow.fromSilo.has(k) ? "#e8f4da" : C.paper);

    // Ponts entre machines adjacentes (fusion des plateformes)
    const bridges = [];
    keys.forEach((k) => {
      if (!isMachine(k)) return;
      const [r, c] = k.split(",").map(Number);
      [[`${r},${c + 1}`, "h"], [`${r + 1},${c}`, "v"]].forEach(([nk, dir]) => {
        if (isMachine(nk)) bridges.push({ k, nk, dir, r, c });
      });
    });

    // Bras des tapis vers leurs voisins
    const beltArms = [];
    keys.forEach((k) => {
      if (factoryGrid[k].type !== "belt") return;
      const [r, c] = k.split(",").map(Number);
      [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([nr, nc]) => {
        const nk = `${nr},${nc}`;
        if (factoryGrid[nk]) beltArms.push({ k, r, c, nr, nc, energized: flow.fromSilo.has(k) && flow.fromSilo.has(nk) });
      });
    });

    const handleBoardDown = (e) => {
      if (!buildMode) return;
      const cell = cellAtPoint(e.clientX, e.clientY);
      if (!cell) return;
      const m = factoryGrid[cell];
      if (m) {
        startDrag(e, m.type, cell);
      } else if (buildSel && buildSel !== "remove") {
        placeType(buildSel, cell);
      }
    };

    return (
      <div>
        <div className="flex items-center justify-between mb-2">
          <div className="text-xs" style={{ color: C.grey }}>
            {buildMode ? "Glisse les machines depuis la palette. Relâche sur une case verte." : "L'usine consomme ton stock de vert chaque nuit : pense au réassort avant de finir la journée."}
          </div>
          <Btn small bg={buildMode ? C.green : C.purple} onClick={() => { setBuildMode(!buildMode); setBuildSel(null); }}>
            {buildMode ? "Terminer" : "Construire"}
          </Btn>
        </div>

        {buildMode && (
          <>
            <div className="flex gap-1 mb-2 flex-wrap">
              {Object.entries(MACHINES).filter(([, m]) => !m.era || era >= m.era).map(([id, m]) => (
                <div key={id}
                  onPointerDown={(e) => startDrag(e, id, null, true)}
                  className="flex-1 rounded-2xl py-1 px-1 text-center select-none"
                  style={{
                    background: buildSel === id ? C.yellow : C.paper, border: `3px solid ${C.dark}`,
                    boxShadow: buildSel === id ? `2px 2px 0 ${C.dark}` : "none", cursor: "grab", minWidth: 68,
                    touchAction: "none", opacity: money < m.cost ? 0.55 : 1,
                  }}>
                  <MachineIcon type={id} />
                  <div className="text-xs font-bold" style={{ color: C.dark }}>{m.short}</div>
                  <div className="text-xs" style={{ color: money < m.cost ? C.red : C.grey }}>{m.cost} €</div>
                </div>
              ))}
              <button type="button" onClick={() => { SFX.click(opts.sfx); setBuildSel(buildSel === "remove" ? null : "remove"); }}
                className="rounded-2xl py-1 px-2 text-center"
                style={{
                  background: buildSel === "remove" ? C.red : C.paper, color: buildSel === "remove" ? "#fff" : C.dark,
                  border: `3px solid ${C.dark}`, cursor: "pointer", minWidth: 68,
                }}>
                <div className="text-lg font-bold leading-none mt-1">✕</div>
                <div className="text-xs font-bold">Démonter</div>
                <div className="text-xs" style={{ color: buildSel === "remove" ? "#fff" : C.grey }}>+50 %</div>
              </button>
            </div>
            {buildSel && buildSel !== "remove" && (
              <div className="text-xs mb-2 font-bold" style={{ color: C.purple }}>{MACHINES[buildSel].name} : {MACHINES[buildSel].desc}</div>
            )}
            {buildSel === "remove" && (
              <div className="text-xs mb-2 font-bold" style={{ color: C.red }}>Touche une machine pour la démonter (remboursée à moitié).</div>
            )}
          </>
        )}

        <Card style={{ background: C.cream, padding: 6 }}>
          <svg ref={gridRef} viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ display: "block", touchAction: buildMode ? "none" : "auto" }}
            onPointerDown={handleBoardDown}>

            {/* Cases disponibles (pointillés, mode construction) */}
            {buildMode && Array.from({ length: ROWS * COLS }).map((_, i) => {
              const r = Math.floor(i / COLS), c = i % COLS;
              const key = `${r},${c}`;
              if (factoryGrid[key]) return null;
              return (
                <rect key={key} x={c * S + 4} y={r * S + 4} width={S - 8} height={S - 8} rx="9"
                  fill="none" stroke="#cdb492" strokeWidth="1.6" strokeDasharray="5 4" />
              );
            })}

            {/* Bras des tapis (sous les plateformes) */}
            {beltArms.map((a, i) => {
              const x1 = cx(a.c), y1 = cy(a.r);
              const x2 = (cx(a.c) + cx(a.nc)) / 2, y2 = (cy(a.r) + cy(a.nr)) / 2;
              return (
                <g key={"arm" + i}>
                  <line x1={x1} y1={y1} x2={x2 + (a.nc - a.c) * 2} y2={y2 + (a.nr - a.r) * 2}
                    stroke={C.dark} strokeWidth="15" strokeLinecap="round" />
                  <line x1={x1} y1={y1} x2={x2 + (a.nc - a.c) * 2} y2={y2 + (a.nr - a.r) * 2}
                    stroke={a.energized ? "#6d9c4a" : "#8a6f55"} strokeWidth="10" strokeLinecap="round" />
                </g>
              );
            })}

            {/* Plateformes des machines : passe sombre puis passe claire = contour fusionné */}
            {keys.filter(isMachine).map((k) => {
              const [r, c] = k.split(",").map(Number);
              return <rect key={"pd" + k} x={c * S + 2} y={r * S + 2} width={S - 4} height={S - 4} rx="12" fill={C.dark} />;
            })}
            {bridges.map((b, i) => {
              const [r, c] = [b.r, b.c];
              return b.dir === "h"
                ? <rect key={"bd" + i} x={c * S + S - 14} y={r * S + 8} width={28} height={S - 16} fill={C.dark} />
                : <rect key={"bd" + i} x={c * S + 8} y={r * S + S - 14} width={S - 16} height={28} fill={C.dark} />;
            })}
            {keys.filter(isMachine).map((k) => {
              const [r, c] = k.split(",").map(Number);
              return <rect key={"pf" + k} x={c * S + 5} y={r * S + 5} width={S - 10} height={S - 10} rx="9" fill={platformFill(k)} />;
            })}
            {bridges.map((b, i) => {
              const [r, c] = [b.r, b.c];
              const fill = flow.fromSilo.has(b.k) && flow.fromSilo.has(b.nk) ? "#e8f4da" : C.paper;
              return b.dir === "h"
                ? <rect key={"bf" + i} x={c * S + S - 11} y={r * S + 11} width={22} height={S - 22} fill={fill} />
                : <rect key={"bf" + i} x={c * S + 11} y={r * S + S - 11} width={S - 22} height={22} fill={fill} />;
            })}

            {/* Rouleaux des tapis */}
            {keys.filter((k) => factoryGrid[k].type === "belt").map((k) => {
              const [r, c] = k.split(",").map(Number);
              const energized = flow.fromSilo.has(k);
              return (
                <g key={"hub" + k}>
                  <circle cx={cx(c)} cy={cy(r)} r="8.5" fill={C.dark} />
                  <circle cx={cx(c)} cy={cy(r)} r="5.5" fill={energized ? "#9fd07a" : "#c9b389"} />
                </g>
              );
            })}
            {beltArms.map((a, i) => {
              const t = 0.62;
              const px = cx(a.c) + (cx(a.nc) - cx(a.c)) / 2 * t;
              const py = cy(a.r) + (cy(a.nr) - cy(a.r)) / 2 * t;
              return <circle key={"dot" + i} cx={px} cy={py} r="2.2" fill={a.energized ? "#e8f4da" : "#e6d9c2"} />;
            })}

            {/* Icônes des machines */}
            {keys.filter(isMachine).map((k) => {
              const [r, c] = k.split(",").map(Number);
              const dragging = drag?.moved && drag?.fromKey === k;
              return (
                <g key={"g" + k} transform={`translate(${c * S + 9}, ${r * S + 9}) scale(1.25)`} opacity={dragging ? 0.3 : 1}>
                  {glyphPaths(factoryGrid[k].type, C)}
                </g>
              );
            })}

            {/* Surbrillance de dépôt : vert possible, rouge impossible */}
            {drag?.moved && dropCell && (() => {
              const [r, c] = dropCell.split(",").map(Number);
              return (
                <rect x={c * S + 2} y={r * S + 2} width={S - 4} height={S - 4} rx="11"
                  fill={dropOk ? "rgba(90,158,61,.3)" : "rgba(201,64,64,.3)"}
                  stroke={dropOk ? C.green : C.red} strokeWidth="3" />
              );
            })()}
          </svg>
        </Card>

        {/* Fantôme sous le doigt */}
        {drag?.moved && drag.type && (
          <div style={{
            position: "fixed", left: drag.x - 22, top: drag.y - 30, zIndex: 60,
            pointerEvents: "none", opacity: 0.92,
            filter: "drop-shadow(2px 3px 0 rgba(58,36,23,.4))",
          }}>
            <MachineIcon type={drag.type} size={44} />
          </div>
        )}

        <Card>
          <div className="text-xs" style={{ color: C.dark }}>
            <b>{nR}</b> torréfacteur{nR > 1 ? "s" : ""} alimenté{nR > 1 ? "s" : ""} ({capIn} kg de vert/jour) · <b>{nB}</b> ensacheuse{nB > 1 ? "s" : ""} reliée{nB > 1 ? "s" : ""} ({capOut} kg vendus/jour max)
          </div>
          {(() => {
            const fc = forecastFactory();
            const totalGreen = r1(activeOrigins.reduce((t, o) => t + (green[o.id] || 0), 0));
            return (
              <>
                <div className="text-xs mt-1 font-bold" style={{ color: fc.ok ? C.green : C.red }}>
                  {fc.ok
                    ? `Cette nuit : ${fc.produced} kg torréfiés${fc.mixed ? " en blend" : ""}, ${fc.sold} kg vendus (+${fc.gain} €)${fc.rest > 0.05 ? `, ${fc.rest} kg vers le stock` : ""}.`
                    : `Usine à l'arrêt : ${fc.why}.`}
                </div>
                <div className="flex items-center justify-between mt-2">
                  <span className="text-xs" style={{ color: C.grey }}>Vert en stock : {totalGreen} kg</span>
                  {nR > 0 && <Btn small bg={C.green} onClick={refillNow}>Réassort auto</Btn>}
                </div>
              </>
            );
          })()}
          <div className="text-xs mt-1" style={{ color: C.grey }}>
            {hasProfile ? `Profil actif : qualité ${bestQ} (−6 en usine).` : "Aucun profil enregistré : la chaîne restera à l'arrêt."}
          </div>
          {factoryLog && <div className="text-xs mt-1" style={{ color: C.purple }}><b>Hier :</b> {factoryLog}</div>}
        </Card>
      </div>
    );
  };

  // ————— Écrans méta —————
  const TitleScreen = () => {
    const SEG_A = "豆豆焙煎".repeat(10);
    const SEG_B = "焙煎豆豆".repeat(10);

  // ————— Rendu —————
  const ALL_TABS = [

    { id: "roast", label: "Torréf.", view: Roaster },
    { id: "blend", label: "Assemblage", view: Blends },
    { id: "orders", label: "Ventes", view: Orders, badge: orders.length },
    { id: "factory", label: "Usine", view: Factory },
    ...(era >= 3 ? [{ id: "stellar", label: stellar ? "Anneau stellaire" : "Anneau stellaire (à bâtir)", view: Stellar }] : []),
  ];
  // Les onglets dont Gaufromatic a pris le contrôle disparaissent pour toujours.
  // On compare via FINAL_DELEGATIONS[].tab : l'id de délégation ("sales") diffère de l'onglet ("orders").
  const delegatedTabs = FINAL_DELEGATIONS.filter((d) => delegated.includes(d.id)).map((d) => d.tab).filter(Boolean);
  const TABS = ALL_TABS.filter((t) => !delegatedTabs.includes(t.id));
  const ActiveView = TABS.find((t) => t.id === tab)?.view || (TABS[0] && TABS[0].view) || Market;

  useEffect(() => {
    if (delegatedTabs.includes(tab) && TABS[0]) setTab(TABS[0].id);
  }, [delegated, tab]);

  // Les intercalaires suivent la ligne jaune/beige, quelle que soit la hauteur du bandeau.
  useEffect(() => {
    const el = headerRef.current;
    if (!el) return;
    const measure = () => {
      const r = el.getBoundingClientRect();
      setTabTop(Math.max(60, Math.round(r.bottom + 10)));
    };
    measure();
    let ro = null;
    if (typeof ResizeObserver !== "undefined") { ro = new ResizeObserver(measure); ro.observe(el); }
    window.addEventListener("resize", measure);
    window.addEventListener("scroll", measure, true);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", measure); window.removeEventListener("scroll", measure, true); };
  }, [screen, era, boss, loan, flashOffer, relics]);

  const audioRef = useRef(null);
  const [musicStarted, setMusicStarted] = useState(false);
  const [deadTracks, setDeadTracks] = useState({}); // pistes en 404, exclues des playlists
  const [currentTrack, setCurrentTrack] = useState(null);

  const inBossContext = screen === "bossIntro" || (screen === "game" && boss);
  // Le pool du contexte courant : une playlist (les fichiers manquants sont filtrés)
  const musicPool = (() => {
    let pool;
    if (screen === "title") pool = MUSIC.title;
    else if (screen === "victory") pool = MUSIC.victory;
    else if (["meta", "cpshop", "runEnd", "transcend", "endProtocol", "endUnplugged", "protocolIntro", "protocolSeq", "unplugIntro"].includes(screen)) pool = MUSIC.meta;
    else if (inBossContext && MUSIC.boss[boss?.type]) pool = MUSIC.boss[boss.type];
    else if (era === 3) pool = MUSIC.era3;
    else if (era === 2) pool = MUSIC.era2;
    else pool = MUSIC.era1;
    const alive = (pool || []).filter((u) => !deadTracks[u]);
    return alive.length ? alive : MUSIC.main.filter((u) => !deadTracks[u]);
  })();
  const poolKey = musicPool.join("|");

  // Quand le contexte change, si la piste en cours n'appartient plus au pool : piste aléatoire du pool
  useEffect(() => {
    if (!musicPool.length) { setCurrentTrack(null); return; }
    if (!currentTrack || !musicPool.includes(currentTrack)) {
      setCurrentTrack(pick(musicPool));
    }
  }, [poolKey, currentTrack]);


  // Fin de piste : on enchaîne sur une autre du pool (rotation aléatoire, évite de rejouer la même si possible)
  const nextTrack = () => {
    if (!musicPool.length) return;
    const others = musicPool.filter((u) => u !== currentTrack);
    setCurrentTrack(others.length ? pick(others) : currentTrack);
    const el = audioRef.current;
    if (el && musicStarted && opts.music > 0) setTimeout(() => el.play().catch(() => {}), 50);
  };

  const musicUrl = currentTrack;

  // La lecture démarre dès qu'une piste devient disponible après le déverrouillage.
  useEffect(() => {
    const el = audioRef.current;
    if (el && musicStarted && musicUrl && opts.music > 0) {
      el.volume = clamp(opts.music / 100, 0, 1);
      const t = setTimeout(() => el.play().catch(() => {}), 60);
      return () => clearTimeout(t);
    }
  }, [musicUrl, musicStarted]);

  // Déverrouillage audio : play() doit être appelé DANS le geste utilisateur
  const unlockMusic = () => {
    if (musicStarted) return;
    setMusicStarted(true); // on arme TOUJOURS : si la piste n'est pas encore choisie,
    const el = audioRef.current;                 // l'effet ci-dessous la lancera dès qu'elle arrive.
    if (el && musicUrl && opts.music > 0) {
      el.volume = clamp(opts.music / 100, 0, 1);
      el.play().catch(() => {});
    }
  };

  useEffect(() => {
    const el = audioRef.current;
    if (!el) return;
    el.volume = clamp(opts.music / 100, 0, 1);
    if (musicStarted && opts.music > 0 && musicUrl) el.play().catch(() => {});
    else el.pause();
  }, [musicStarted, opts.music, musicUrl]);

  // Le volume doit suivre le curseur en temps réel, même pendant la lecture.
  useEffect(() => {
    const el = audioRef.current;
    if (el) el.volume = clamp(opts.music / 100, 0, 1);
  }, [opts.music]);

  return (
    <div className="min-h-screen flex justify-center items-stretch sm:items-center" style={{
        fontFamily: "'Baloo 2','Trebuchet MS',system-ui,sans-serif",
        background: `radial-gradient(circle at 50% 30%, #f4df9e 0%, ${C.yellow} 45%, #e0b94f 100%)`,
      }}
      onPointerDownCapture={unlockMusic}>
      <style>{`
        @media (min-width: 640px) {
          .game-frame { height: 92vh; overflow-y: auto; overflow-x: hidden; }
        }
        /* Infobulles des onglets : uniquement pour les vrais pointeurs (ordinateur) */
        @media (hover: hover) and (pointer: fine) {
          .mmr-tab:hover .mmr-tip { opacity: 1; transform: translateX(-50%) translateY(-2px); }
          .mmr-tab:hover svg { transform: translateY(-2px) scale(1.12); }
        }
        .mmr-tab svg { transition: transform .15s ease; }
        .mmr-tab:hover { filter: brightness(1.07); }
        .mmr-content { padding-left: 52px; }
        /* Overlays (pub flash) : collés à l'écran visible, jamais à la hauteur du contenu */
        .mmr-overlay {
          position: fixed; top: 0; bottom: 0;
          left: 50%; transform: translateX(-50%);
          width: 100%; max-width: 28rem;
        }
        /* Intercalaires : restent visibles quel que soit le défilement */
        .mmr-tabbar {
          position: fixed !important;
          left: max(0px, calc(50vw - 14rem)) !important;
          transform: none !important;
        }
        @media (min-width: 640px) {
          .mmr-overlay { top: 4vh; bottom: 4vh; border-radius: 28px; }
        }
      `}</style>
      {/* Grains décoratifs en fond, visibles surtout sur grand écran */}
      <div className="hidden sm:block fixed inset-0 pointer-events-none" style={{ opacity: 0.5, zIndex: 0 }}>
        <svg width="100%" height="100%">
          {Array.from({ length: 22 }).map((_, i) => {
            const x = (i * 61) % 100, y = (i * 37) % 100, r = 14 + (i % 4) * 6, rot = (i * 47) % 360;
            return (
              <g key={i} transform={`translate(${x}%, ${y}%) rotate(${rot})`} opacity={0.22}>
                <ellipse cx="0" cy="0" rx={r * 0.72} ry={r} fill="#7a4a2a" />
                <path d={`M0 ${-r} Q ${r * 0.34} 0 0 ${r}`} stroke="#5a3418" strokeWidth={r * 0.13} fill="none" />
              </g>
            );
          })}
        </svg>
      </div>
      <div className="w-full max-w-md flex flex-col min-h-screen sm:min-h-0 sm:my-4 sm:rounded-[28px] relative game-frame"
        style={{
          background: C.cream, zIndex: 1, position: "relative",
          boxShadow: "0 0 0 3px rgba(58,36,23,0.9), 0 18px 50px rgba(58,36,23,0.35)",
        }}>
        {musicUrl && (
          <audio ref={audioRef} src={musicUrl} preload="auto"
            onEnded={nextTrack}
            onError={() => { setDeadTracks((d) => ({ ...d, [musicUrl]: true })); setCurrentTrack(null); }} />
        )}

        {screen === "title" && TitleScreen()}
        {screen === "draft" && DraftScreen()}
        {screen === "runEnd" && RunEndScreen()}
        {screen === "meta" && MetaScreen()}
        {screen === "bossIntro" && BossIntroScreen()}
        {screen === "delegation" && DelegationScreen()}
        {screen === "protocolIntro" && ProtocolIntroScreen()}
        {screen === "protocolSeq" && ProtocolSeqScreen()}
        {screen === "unplugIntro" && UnplugIntroScreen()}
        {screen === "endProtocol" && EndProtocolScreen()}
        {screen === "endUnplugged" && EndUnpluggedScreen()}
        {screen === "transcend" && TranscendScreen()}
        {screen === "victory" && VictoryScreen()}
        {screen === "eraUp" && EraUpScreen()}
        {screen === "eraUp3" && EraUp3Screen()}
        {screen === "cpshop" && CpShopScreen()}

        {screen === "game" && (
          <>
            <div ref={headerRef} className="p-3 pb-2" style={{ background: era === 3 ? "#1a1433" : era === 2 ? C.dark : C.yellow, borderBottom: `3px solid ${C.dark}`, transition: "background .6s" }}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="font-bold text-lg" style={{ color: era >= 2 ? C.yellow : C.dark }}><BeanIcon fill={era >= 2 ? C.yellow : C.dark} /> Jour {day}{era === 3 ? " · Ère 3" : era === 2 ? " · Ère 2" : ""}</div>
                  <div className="text-xs" style={{ color: era >= 2 ? C.cream : C.dark }}>
                    {title}{bossesBeaten > 0 ? ` · ${bossesBeaten} boss vaincu${bossesBeaten > 1 ? "s" : ""}` : ""}
                  </div>
                </div>
                <div className="flex gap-2">
                  <Btn small bg={C.grey} onClick={() => setMenuOpen(true)}>Menu</Btn>
                  <Btn small onClick={endDay} bg={boss ? C.red : C.purple}>{boss ? "Verdict du soir" : "Jour suivant"}</Btn>
                </div>
              </div>
              <div className="flex gap-2 mt-2 text-sm font-bold flex-wrap" style={{ color: C.dark }}>
                <span className="rounded-full px-2 py-0.5" style={{ background: C.paper, border: `2px solid ${C.dark}`, color: money < 20 + day ? C.red : C.dark }}>{money} €</span>
                <span className="rounded-full px-2 py-0.5" style={{ background: C.paper, border: `2px solid ${C.dark}` }}>Rep {rep.toFixed(1)}/5</span>
                <span className="rounded-full px-2 py-0.5" style={{ background: C.paper, border: `2px solid ${C.dark}`, color: C.grey }}>Charges ce soir : {Math.max(3, (era === 3 ? 40 : era === 2 ? 20 : 8) + day - mLvl("assurance"))} €</span>
                {loan && (
                  <span className="rounded-full px-2 py-0.5" style={{ background: loan.dueIn <= 1 ? C.red : C.paper, border: `2px solid ${C.dark}`, color: loan.dueIn <= 1 ? "#fff" : C.red }}>
                    Dette {loan.debt} € · J−{loan.dueIn}
                  </span>
                )}
                {!boss && (day % BOSS_EVERY === BOSS_EVERY - 1) && (
                  <span className="rounded-full px-2 py-0.5" style={{ background: C.dark, border: `2px solid ${C.dark}`, color: C.yellow }}>Boss demain !</span>
                )}
              </div>
              {boss && (
                <div className="mt-2 rounded-2xl px-3 py-2 text-xs font-bold" style={{ background: C.red, color: "#fff", border: `2px solid ${C.dark}` }}>
                  {boss.name} — {boss.desc}
                  {boss.type === "rival" && <span> Meilleure torréf manuelle du jour : {boss.best || 0}.</span>}
                </div>
              )}
              {flashOffer?.seen && (
                <div className="mt-2 rounded-2xl px-3 py-1 text-xs font-bold" style={{ background: C.paper, color: C.orange, border: `2px solid ${C.dark}` }}>
                  Offre flash active : {
                    flashOffer.type === "promo" ? `${flashOffer.originName} vert à −50 % au marché` :
                    flashOffer.type === "vip" ? `commande d'exception dans l'onglet Ventes` :
                    "vente directe doublée aujourd'hui"
                  }
                </div>
              )}
              {Object.keys(relics).length > 0 && (
                <div className="text-xs mt-1" style={{ color: C.purple }}>
                  {Object.entries(relics).map(([rid, lvl]) => { const def = RELICS.find((r) => r.id === rid) || LEGENDARIES.find((r) => r.id === rid); return def ? `${def.name}${lvl > 1 ? " " + ROMAN[lvl] : rid.startsWith("lg_") ? "" : " " + ROMAN[lvl]}` : rid; }).join(" · ")}
                </div>
              )}
            </div>

            <div className="flex-1 overflow-y-auto p-3" style={{ paddingLeft: 56, paddingBottom: 16 }}>
              {ActiveView()}
            </div>

            {/* Intercalaires verticaux, façon onglets de classeur, sur le bord droit */}
            <div className="mmr-tabbar" style={{
              display: "flex", flexDirection: "column", gap: 7, zIndex: 40, top: tabTop,
            }}>
              {TABS.map((t) => {
                const on = tab === t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)} title={t.label}
                    className="relative mmr-tab flex items-center justify-center"
                    style={{
                      width: on ? 52 : 42, height: 46,
                      marginRight: on ? -10 : 0,
                      background: TAB_COLORS[t.id] || C.amber,
                      color: C.dark,
                      border: `3px solid ${C.dark}`, borderLeft: "none",
                      borderRadius: "0 16px 16px 0",
                      boxShadow: on ? `3px 3px 0 rgba(58,36,23,.35)` : "none",
                      opacity: on ? 1 : 0.82,
                      transition: "width .16s ease, margin-left .16s ease, opacity .16s ease",
                      cursor: "pointer",
                    }}>
                    <TabIcon id={t.id} active />
                    {/* Infobulle : au survol souris (ordinateur) uniquement */}
                    <span className="mmr-tip" style={{
                      position: "absolute", left: "100%", top: "50%", transform: "translateY(-50%)",
                      marginLeft: 8, padding: "4px 10px", borderRadius: 10, whiteSpace: "nowrap",
                      background: C.dark, color: C.cream, fontSize: 12, fontWeight: 700,
                      opacity: 0, pointerEvents: "none", transition: "opacity .15s",
                    }}>{t.label}</span>
                    {t.badge > 0 && (
                      <span className="absolute rounded-full text-xs font-bold flex items-center justify-center"
                        style={{ top: -5, right: -7, width: 18, height: 18, background: C.red, color: "#fff", border: `2px solid ${C.paper}` }}>
                        {t.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            {GaufroWidget()}
            {menuOpen && PauseMenu()}
            {RetroAd()}
          </>
        )}

        {overlay === "options" && OptionsOverlay()}
        {overlay === "saves" && SavesOverlay()}

        {toast && (
          <div className="fixed left-1/2 z-50 rounded-2xl px-4 py-2 font-bold text-sm text-center"
            style={{ bottom: 84, transform: "translateX(-50%)", background: C.dark, color: C.yellow, border: `3px solid ${C.yellow}`, maxWidth: "92%", pointerEvents: "none" }}>
            {toast}
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<MameMameSaisons />);

</script>
</body>
</html>
